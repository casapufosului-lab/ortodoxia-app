# Continuous integration gate for the Ortodoxia app.
#
# WHY THIS EXISTS
# ---------------
# The audit found no CI configuration at all: 42 test files with only five wired to
# npm scripts, no aggregate `test` script, no static check for the Edge Functions
# (they are excluded from the app tsconfig), and therefore no automatic gate before
# a release. Several stale assertions and two false tests had survived in the tree
# precisely because nothing ran them.
#
# This workflow runs the checks that must hold for every commit:
#   - typecheck       : the React Native app (strict)
#   - typecheck:edge  : the Supabase Edge Functions (previously unchecked)
#   - test:i18n       : locale corpus integrity and script contamination
#   - test:a11y       : the accessibility gate (roles, labels, 44pt targets, WCAG AA contrast)
#   - test:safety     : the gate parsers' own self-tests (a blind gate is worse than none)
#   - test:startup    : the startup budget (what is evaluated before the first screen)
#   - test            : every discovered suite, in one process
#   - test:release    : current-code release invariants (ignores paid-launch inputs)
#
# `test:a11y`, `test:safety` and `test:startup` were added later and are listed here on purpose: a gate
# that CI never runs is a gate that silently stops existing. They need no bundler, no device and no key
# except `test:startup`, which runs one Metro export (~1-2 min) and was therefore given its own step so a
# failure is attributable.
#
# It deliberately does NOT run `release-readiness --release`, because that mode
# fails until the paid store accounts and the real content corpus exist. That gate
# is run by hand immediately before a production build.
#
# The `verify` job does not build, deploy or publish anything.
#
# The second job, `android-artifact`, exists because of C23 in the audit: nothing in CI ever
# produced or inspected a release ARTIFACT, so the two Android findings that only show up in a
# BUILT manifest could not be caught automatically:
#   - A9: the ShortcutBadger badge/storage permissions come back if the hardening plugin is
#     lost when `android/` is regenerated at prebuild (it is gitignored — see B8);
#   - A10: cleartext traffic re-enabled.
# It produces the merged release manifest with Gradle and diffs it with
# `scripts/verify-android-release-manifest.mjs`. It needs the Android SDK and takes several
# minutes, so it never runs on push: only on `workflow_dispatch` with `android_artifact: true`.
# It does NOT sign and does NOT upload anything — the store artifact stays with the owner,
# because the upload key is known only after Play App Signing.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      android_artifact:
        description: 'Verifică manifestul MERGED al unui build de release (SDK Android, ~10 min)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `.env` is git-ignored on purpose (the real file stays on the developer machine), but the
      # release-readiness gate checks that it exists, and the startup budget needs the public
      # EXPO_PUBLIC_* values to be defined. So CI writes the same public values a developer has;
      # none of these are secrets (they all end up in the JS bundle).
      - name: Write .env (public values)
        run: |
          cat > .env <<'EOF'
          EXPO_PUBLIC_SUPABASE_URL=https://pgjabfgibdpcomegkojg.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_jUBqWb3gn6ZDOcUuNJbVKg_CwswrjQr
          EXPO_PUBLIC_REVENUECAT_APPLE_API_KEY=appl_voOlpavdeOGYDVBEdGegdUTFUbh
          EXPO_PUBLIC_REVENUECAT_GOOGLE_API_KEY=goog_EIZcHpAwRfOaqQRPjfMGlXOvvGo
          EXPO_PUBLIC_LEGAL_ENTITY=YAC PLANET S.R.L., CUI 50636986, Reg. Com. J2024027573006
          EXPO_PUBLIC_SUPPORT_EMAIL=yacplanet@ortodoxiaapp.anonaddy.com
          EXPO_PUBLIC_LEGAL_POSTAL_ADDRESS=Sat Dăești, Comuna Dăești, Strada Calea lui Traian, Nr. 75, Județul Vâlcea
          EXPO_PUBLIC_LEGAL_JURISDICTION=România
          EXPO_PUBLIC_LEGAL_LOCALITY=Dăești, Județul Vâlcea
          EXPO_PUBLIC_LEGAL_EFFECTIVE_DATE=23 septembrie 2026
          EXPO_PUBLIC_PRIVACY_POLICY_URL=https://ortodoxia.web.app/privacy
          EXPO_PUBLIC_TERMS_URL=https://ortodoxia.web.app/terms
          ENVIRONMENT=production
          EOF
          echo "--- chei scrise in .env:"; sed 's/=.*//' .env

      - name: Typecheck app
        run: npm run typecheck

      - name: Typecheck Edge Functions
        run: npm run typecheck:edge

      - name: Validate i18n corpus (key parity + script contamination)
        run: npm run test:i18n

      - name: Accessibility gate
        run: npm run test:a11y

      - name: Gate self-tests (the parsers behind test:a11y and test:startup)
        run: npm run test:safety

      - name: Run test suite
        run: npm test

      - name: Startup budget (one Metro export)
        run: npm run test:startup

      - name: Release readiness (current-code invariants)
        run: npm run test:release

  android-artifact:
    name: merged release manifest (manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.android_artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate the android project (the way EAS does at prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Produce the merged release manifest (no signing, no upload)
        working-directory: android
        run: ./gradlew :app:processReleaseManifest --no-daemon

      - name: Diff the merged manifest (A9 + A10)
        run: node scripts/verify-android-release-manifest.mjs android/app/build/intermediates
