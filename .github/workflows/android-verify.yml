name: Android verify (emulator + Maestro, fara publicare)

# DE CE EXISTA: masuratoarea OFICIALA pentru Android (cele 36 de rezultate) se face in cloud, pe un
# emulator curat, nu pe emulatorul din casa (decizia ownerului, 13.10.2026). Local ramane pentru
# verificari scurte de 5 minute, care NU intra in cele 36 de rezultate.
#
# NU publica nimic: nu exista pas de urcare in Play. APK-ul se construieste AICI, din commitul rulat,
# semnat cu cheia de debug a proiectului (gradle cade pe `signingConfigs.debug` cand nu exista keystore
# de urcare) - deci NU ajung chei de magazin in GitHub si nu se urca niciun binar nicaieri.
#
# CAND PORNETE: doar manual. `gh workflow run android-verify.yml -f flow=toate`
#   - `flow=toate`   -> toate cele 12 flow-uri x 3 treceri = 36 de rezultate (suita completa);
#   - `flow=<nume>`  -> un singur flow (verificare tintita, mult mai rapida).
#
# STRUCTURA:
#   jobul `build` = scrie .env + google-services.json, prebuild, APK release pe x86_64 (~25 min);
#   joburile `flows` = 12 joburi, fiecare cu emulatorul lui, 3 treceri per flow (max 4 in paralel);
#   jobul `poarta` = refuza suita daca orice flow a picat sau nu a produs toate cele 3 rezultate.
#
# REGULI CARE SE VAD IN COD:
#   - APK-ul masurat se dovedeste: versionCode=8 si SHA-256 (apk-log.txt), citite din binarul instalat;
#   - `pm clear` inainte de fiecare trecere => identitate curata => cota de chat 5/5;
#   - 3 treceri CURATE DIN PRIMA INCERCARE; o trecere picata NU se reia, seria se reia de la 1;
#   - fiecare trecere lasa JUnit + PNG; dovada de diagnostic (.incercarea1.*) ramane pe disc.

on:
  workflow_dispatch:
    inputs:
      flow:
        description: "Flow de rulat: 'toate' sau unul singur (home, prayers, calendar, bible, chat, account, auth, live, premium, legal, notifications, errors)"
        required: false
        default: "toate"
      passes:
        description: "Cate treceri curate per flow (3 = cerinta ownerului)"
        required: false
        default: "3"

concurrency:
  group: android-verify
  cancel-in-progress: false

env:
  APP_ID: ro.ortodoxia.app
  ANDROID_API: "36"
  MAESTRO_CLI_NO_ANALYTICS: "1"

jobs:
  plan:
    name: Stabileste lista de flow-uri
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flows: ${{ steps.plan.outputs.flows }}
    steps:
      - id: plan
        run: |
          set -e
          TOATE='["home","prayers","calendar","bible","chat","account","auth","live","premium","legal","notifications","errors"]'
          CERUT="${{ inputs.flow }}"
          if [ -z "$CERUT" ] || [ "$CERUT" = "toate" ]; then
            echo "flows=$TOATE" >> "$GITHUB_OUTPUT"
            echo "rulez toata suita: 12 flow-uri x ${{ inputs.passes }} treceri"
          else
            echo "$TOATE" | grep -q "\"$CERUT\"" || { echo "::error::flow necunoscut: $CERUT"; exit 1; }
            echo "flows=[\"$CERUT\"]" >> "$GITHUB_OUTPUT"
            echo "rulez un singur flow: $CERUT"
          fi

  build:
    name: Build APK release (fara chei de magazin)
    needs: plan
    runs-on: ubuntu-latest
    # npm ci + prebuild + gradle (o singura arhitectura) ≈ 25 min.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # FARA `cache: gradle`: la acest pas nu exista inca niciun fisier gradle in arbore
          # (android/ e git-ignorat si se genereaza la prebuild), iar actiunea cade cu
          # "No file ... matched to [**/*.gradle*]". Cache-ul se poate readuce dupa prebuild.

      - name: Scrie .env din configuratia publica (.github/ci.env)
        run: |
          set -e
          cp .github/ci.env .env
          echo "--- variabile scrise in .env (doar numele):"
          sed 's/=.*//' .env

      - name: Scrie google-services.json (FCM) din secret
        # Fara FCM nu construim (regula ownerului, 13.10.2026). Fisierul e git-ignorat, deci in CI
        # vine doar din secretul criptat al depozitului; valoarea nu se tipareste niciodata.
        env:
          FCM_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -z "${FCM_B64}" ]; then
            echo "::error::lipseste secretul GOOGLE_SERVICES_JSON (nu construim fara FCM)."
            exit 1
          fi
          printf '%s' "$FCM_B64" | base64 -d > google-services.json
          node -e "
            const j = require('./google-services.json');
            const pid = j.project_info && j.project_info.project_id;
            const pkg = (j.client || []).map(c => c.client_info && c.client_info.android_client_info && c.client_info.android_client_info.package_name);
            if (pid !== 'ortodoxia') { console.error('project_id gresit: ' + pid); process.exit(1); }
            if (!pkg.includes('ro.ortodoxia.app')) { console.error('package gresit: ' + pkg.join(',')); process.exit(1); }
            console.log('FCM ok: project_id=' + pid + ' package=ro.ortodoxia.app');
          "

      - name: npm ci
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild -p android --no-install

      - name: Poarta pe configuratia nativa (versionCode 8, applicationId, FCM)
        run: |
          set -e
          grep -q "versionCode 8" android/app/build.gradle || { echo "::error::versionCode nu e 8 in android/app/build.gradle"; exit 1; }
          grep -q "applicationId 'ro.ortodoxia.app'" android/app/build.gradle || { echo "::error::applicationId nu e ro.ortodoxia.app"; exit 1; }
          test -s android/app/google-services.json || { echo "::error::android/app/google-services.json lipseste sau e gol"; exit 1; }
          grep -n "versionCode\|applicationId" android/app/build.gradle

      - name: Build APK release (doar x86_64, cat pentru emulator)
        run: |
          set -e
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Masoara APK-ul (marime + SHA-256)
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" app-release.apk
          ls -l app-release.apk
          sha256sum app-release.apk | tee apk-info.txt

      - name: Publica APK-ul pentru joburile de flow-uri
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          retention-days: 7
          path: |
            app-release.apk
            apk-info.txt

  flows:
    name: flow ${{ matrix.flow }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    # boot emulator ≈ 3 min + 3 treceri ≈ 6 min + instalare Maestro ≈ 1 min.
    timeout-minutes: 60
    strategy:
      # Un flow picat NU opreste restul: vrem toate cele 36 de rezultate intr-o singura rulare.
      fail-fast: false
      # 12 emulatoare deodata ar concura pe acelasi cont de runneri; valuri de 4 sunt sigure.
      max-parallel: 4
      matrix:
        flow: ${{ fromJSON(needs.plan.outputs.flows) }}
    env:
      FLOW: ${{ matrix.flow }}
      ANDROID_PASSES: ${{ inputs.passes }}
    steps:
      - uses: actions/checkout@v4

      - name: Descarca APK-ul construit
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Instaleaza Maestro
        run: |
          set -e
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Activeaza KVM (emulatorul porneste cu accelerare)
        run: |
          set -e
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ruleaza flow-ul "${{ matrix.flow }}" in ${{ inputs.passes }} treceri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: ci-api36
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash .github/scripts/ruleaza-android-flows.sh

      - name: Publica dovezile flow-ului
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flow }}-dovezi
          if-no-files-found: warn
          retention-days: 7
          path: |
            maestro-pass*.xml
            maestro-pass*.incercarea1.xml
            maestro-pass*-debug/**
            flow-results.txt
            retry-log.txt
            apk-log.txt
            chat-latency.txt
            hierarchy-pass*.txt
            ci-screenshots/**/*.png

  poarta:
    name: Poarta - toate cele 36 de rezultate
    needs: [flows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuza suita daca orice flow a picat sau nu a rulat
        run: |
          set -e
          echo "rezultatul joburilor de flow-uri: ${{ needs.flows.result }}"
          if [ "${{ needs.flows.result }}" != "success" ]; then
            echo "::error::Cel putin un flow a picat sau nu a produs toate rezultatele. Suita NU e verde."
            exit 1
          fi
          echo "VERDE: flow-urile au produs toate rezultatele, zero picate."
