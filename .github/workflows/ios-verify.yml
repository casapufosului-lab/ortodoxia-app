name: iOS verify (simulator + Maestro, fara publicare)

# DE CE EXISTA: acelasi lucru pe care il facea workflow-ul `ios-verify` din codemagic.yaml, dar pe
# runneri macOS de la GitHub, care pornesc in SECUNDE (fara coada de 1-2 ore a Codemagic).
#
# NU publica nimic: nu are pas de TestFlight / App Store Connect, iar build-ul e Release pentru
# SIMULATOR, semnat ad-hoc asa cum semneaza Xcode pentru simulator (CODE_SIGN_IDENTITY="-").
#
# CORECTIE 14.10.2026 (masurata in rularea 38535947525, jobul `flow chat`): pana azi build-ul se facea
# NESEMNAT (CODE_SIGNING_ALLOWED=NO). Un .app de simulator fara entitlementuri nu poate folosi seiful
# de chei: `expo-secure-store` raspunde cu
#   FunctionCallException: Calling the 'getValueWithKeyAsync' function has failed
# Citit din fisierul propriu al aplicatiei (`Documents/chat-latency.log`):
#   [chat-latency] cererea a plecat 0 ms (oaspete, fir nou)
#   [chat-latency] excepție 659 ms (sesiunea de oaspete: FunctionCallException: ... getValueWithKeyAsync ...)
# Adaptorul de sesiune REFUZA prin constructie sa scrie tokenul in clar (`src/lib/secure-session-storage.ts`,
# secțiunea "NO PLAINTEXT FALLBACK"), deci sesiunea de oaspete nu se putea salva, iar flow-ul `chat` cadea in
# toate cele 3 treceri pe asertiunea de raspuns real (nu pe vreun pas de tastatura). Acelasi lucru era deja
# dovedit si reparat pe Codemagic pe 12.10.2026 (`codemagic.yaml:244-260`: ".app-ul nu are niciun entitlement,
# deci securityd refuza orice acces la seif (Code=-34018)"), dar corectia NU fusese adusa in acest workflow.
#
# CAND PORNETE:
#   - DOAR manual (workflow_dispatch). `on: push` a fost scos pe 11.10.2026: fiecare push pornea o
#     rulare macOS. Din CLI: gh workflow run ios-verify.yml --ref master
#   - Acesta e CANALUL PRINCIPAL de verificare iOS de pe 12.10.2026: repo-ul e PUBLIC, iar GitHub da
#     minute macOS GRATIS si NELIMITATE la repo public (la privat: 2000 min/luna, consumate de ~10x
#     pe macOS, epuizate pana 1 noiembrie). Codemagic ramane doar pentru build-ul semnat de TestFlight.
#
# STRUCTURA (paralelizata 12.10.2026):
#   jobul `build`  = compileaza .app-ul O DATA (~20 min) si il publica ca artefact;
#   joburile `flows` = 12 joburi IN PARALEL (unul per flow, 3 treceri fiecare) = 36 de rezultate;
#   jobul `poarta` = refuza suita daca oricare flow a picat sau nu a produs toate rezultatele.
#   Timpul total scade de la ~75 min (secvential) la ~25-30 min; daca GitHub limiteaza concurenta,
#   o parte din joburi asteapta, dar tot ramane mult mai rapid decat varianta secventiala.
#
# REGULA PROIECTULUI: codul se comite inainte de rulare (workflow-ul verifica exact commitul pornit).

on:
  # DOAR manual. `on: push` a fost scos pe 11.10.2026 (fiecare push pornea o rulare macOS).
  # Din CLI: gh workflow run ios-verify.yml --ref master
  workflow_dispatch:

concurrency:
  group: ios-verify-macos
  cancel-in-progress: false

env:
  BUNDLE_ID: ro.ortodoxia.app
  XCODE_WORKSPACE: ios/Ortodoxia.xcworkspace
  XCODE_SCHEME: Ortodoxia
  APP_BUILD_NUMBER: "21"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  # 3 treceri = cerinta ownerului (72 de rezultate pe ambele platforme). Se poate da mai putin
  # pentru o iteratie rapida pe un singur flow (workflow_dispatch nu are inca input; se schimba aici).
  IOS_PASSES: "3"

jobs:
  build:
    name: Build .app pentru simulator
    runs-on: macos-26
    # npm + prebuild + pod install + xcodebuild ≈ 20-25 min.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # DE CE XCODE 26.6 (si nu altceva):
      #   - React Native 0.86 cere Xcode >= 16.1 (macos-14 are 15.4 => `pod install` moare);
      #   - build-ul imbricat "Build ExpoModulesJSI xcframework" are nevoie de Swift tools 6.2,
      #     iar implicitul macos-15 (Xcode 16.4) are Swift 6.1 =>
      #     "package 'apple' is using Swift tools version 6.2.0 but the installed version is 6.1.0";
      #   - Xcode 26.0.1-26.3 au Swift 6.2, dar sunt prea stricte pe C++ si pica in
      #     RuntimeScheduler.h (bug upstream expo/expo#50061), deci "cel mai nou Xcode" nu e o solutie;
      #   - imaginea macos-26 are Xcode 26.6 IMPLICIT (17F113) = toolchain-ul cu care Codemagic a
      #     compilat .app-ul cu succes. Garda de mai jos cere exact 26.6.
      - name: Verifica Xcode 26.6 (toolchain-ul cu care a construit Codemagic)
        run: |
          set -e
          echo "--- Xcode-uri instalate:"
          ls -d /Applications/Xcode*.app || true
          echo "--- Xcode activ:"
          xcodebuild -version
          VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          if [ "$VER" != "26.6" ]; then
            echo "ATENTIE: Xcode activ $VER, dar build-ul cere 26.6 (Swift 6.2.4)."
            if [ -d /Applications/Xcode_26.6.app ]; then
              sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
              xcodebuild -version
              VER=$(xcodebuild -version | head -1 | awk '{print $2}')
            fi
          fi
          if [ "$VER" != "26.6" ]; then
            echo "::error::Xcode 26.6 nu e disponibil pe acest runner (activ: $VER)."
            exit 1
          fi
          swift --version

      - name: Instaleaza dependintele
        run: npm ci

      - name: Scrie .env pentru Expo
        run: |
          set -e
          cat > .env <<'EOF'
          EXPO_PUBLIC_SUPABASE_URL=https://pgjabfgibdpcomegkojg.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_jUBqWb3gn6ZDOcUuNJbVKg_CwswrjQr
          EXPO_PUBLIC_REVENUECAT_APPLE_API_KEY=appl_voOlpavdeOGYDVBEdGegdUTFUbh
          EXPO_PUBLIC_REVENUECAT_GOOGLE_API_KEY=goog_EIZcHpAwRfOaqQRPjfMGlXOvvGo
          EXPO_PUBLIC_LEGAL_ENTITY=YAC PLANET S.R.L., CUI 50636986, Reg. Com. J2024027573006
          EXPO_PUBLIC_SUPPORT_EMAIL=yacplanet@ortodoxiaapp.anonaddy.com
          EXPO_PUBLIC_LEGAL_POSTAL_ADDRESS=Sat Dăești, Comuna Dăești, Strada Calea lui Traian, Nr. 75, Județul Vâlcea
          EXPO_PUBLIC_LEGAL_JURISDICTION=România
          EXPO_PUBLIC_LEGAL_LOCALITY=Dăești, Județul Vâlcea
          EXPO_PUBLIC_LEGAL_EFFECTIVE_DATE=23 septembrie 2026
          EXPO_PUBLIC_PRIVACY_POLICY_URL=https://ortodoxia.web.app/privacy
          EXPO_PUBLIC_TERMS_URL=https://ortodoxia.web.app/terms
          ENVIRONMENT=production
          EOF
          echo "--- chei scrise in .env:"
          sed 's/=.*//' .env

      - name: Expo prebuild (generate ios/)
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --clean
          # ATENTIE (dovedit 11.10.2026): `expo prebuild` iese cu cod 0 chiar daca `pod install`
          # a esuat, deci pasul pare verde si urmatorul pas cade pe un workspace inexistent. De aceea
          # verificam explicit ca pod install a produs workspace-ul.
          test -d ios/Ortodoxia.xcworkspace || {
            echo "::error::pod install nu a produs ios/Ortodoxia.xcworkspace (vezi liniile de mai sus: Xcode prea vechi / Podfile invalid)."
            exit 1
          }
          ls -d ios/Ortodoxia.xcworkspace

      - name: Set build number
        run: cd ios && agvtool new-version -all "$APP_BUILD_NUMBER"

      - name: Build .app pentru simulator (Release, semnat ad-hoc ca pentru orice proiect RN)
        run: |
          set -uo pipefail
          mkdir -p build
          LOG=build/xcodebuild.log
          # Fara `| tail`: pe 11.10.2026 exact filtrul acesta a ascuns mesajul de eroare
          # (ultimele 60 de linii erau doar "note: Disabling previews") si a lasat in log doar
          # un exit 65 fara nicio explicatie. Scriem tot in fisier si scoatem la iveala erorile.
          #
          # SEMNAREA: build-ul de simulator se face asa cum il face Xcode in mod normal pentru
          # simulator - semnare pornita, identitate ad-hoc ("-" = Sign to Run Locally), fara echipa
          # si fara profil - si pachetul NU se mai modifica dupa build. In configuratia aceasta
          # entitlementurile derivate (application-identifier, get-task-allow) fac seiful de chei
          # accesibil. Fara ele, `expo-secure-store` nu poate scrie sesiunea (Code=-34018) si
          # flow-ul `chat` cade inainte sa trimita vreo cerere. Aceeasi configuratie ca in
          # `codemagic.yaml:232`, unde a fost dovedita pe 12.10.2026.
          set +e
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios-sim \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            build > "$LOG" 2>&1
          CODE=$?
          set -e
          echo "xcodebuild exit code: $CODE"
          grep -n -E "error:|fatal error|Undefined symbol|ld: |\*\* BUILD FAILED \*\*|Command .* failed" "$LOG" | head -60 || true
          if [ "$CODE" -ne 0 ]; then
            echo "::error::xcodebuild a picat (exit $CODE). Ultimele 80 de linii din $LOG:"
            tail -n 80 "$LOG"
            exit "$CODE"
          fi
          ls -d build/ios-sim/Build/Products/Release-iphonesimulator/*.app

      - name: Verifica semnatura .app-ului (conditia pentru seif) - poarta, nu doar dovada
        run: |
          set -uo pipefail
          APP=$(ls -d build/ios-sim/Build/Products/Release-iphonesimulator/*.app | head -1)
          {
            echo "== aplicatia: $APP"
            echo "== identitatea semnaturii (codesign -dv):"
            codesign -dv --verbose=2 "$APP" 2>&1 || true
            echo "== entitlementurile din semnatura:"
            codesign -d --entitlements - "$APP" 2>&1 || true
            echo "== verificare semnatura:"
            codesign --verify --strict "$APP" 2>&1 && echo "semnatura verificata" || true
            echo "== conditia pentru seif (application-identifier):"
            if codesign -d --entitlements - "$APP" 2>/dev/null | grep -q "application-identifier"; then
              echo "PREZENT: aplicatia poate folosi seiful de chei."
            else
              echo "LIPSA: fara application-identifier, securityd refuza seiful (Code=-34018)."
            fi
          } | tee entitlements.txt
          # Poarta: acest pas OPREste rularea daca seiful e inaccesibil. Altfel cele 12 joburi de
          # flow-uri pornesc pe o aplicatie care nu-si poate salva sesiunea si dau 36 de rezultate
          # inselatoare, iar cauza (build nesemnat) nu se vede in niciunul dintre ele.
          if ! codesign -d --entitlements - "$APP" 2>/dev/null | grep -q "application-identifier"; then
            echo "::error::.app-ul nu are application-identifier: build-ul a iesit nesemnat, deci flow-urile care folosesc seiful (chat) ar cadea din cauza mediului, nu a aplicatiei."
            exit 1
          fi

      - name: Proba de retea a runnerului (DNS + TLS + HTTP pana la Supabase)
        run: |
          set +e
          SUPABASE_URL=$(grep -E '^[[:space:]]*EXPO_PUBLIC_SUPABASE_URL=' .env | head -1 | cut -d= -f2- | tr -d '\r' | xargs)
          echo "======== proba de retea a runnerului ========"
          curl -sS -o /dev/null -w 'auth health: %{http_code} (%{time_total}s)\n' "$SUPABASE_URL/auth/v1/health" || true

      - name: Impacheteaza .app-ul pentru joburile de flow-uri
        run: |
          set -euo pipefail
          APP=$(ls -d build/ios-sim/Build/Products/Release-iphonesimulator/*.app | head -1)
          echo "Aplicatie: $APP"
          # ditto pastreaza structura si atributele (zip-ul se dezarhiveaza identic pe alt runner).
          ditto -c -k --sequesterRsrc --keepParent "$APP" ios-sim-app.zip
          ls -l ios-sim-app.zip

      - name: Publica .app-ul (artefact pentru joburile de flow-uri)
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-app
          if-no-files-found: error
          retention-days: 3
          path: ios-sim-app.zip

      - name: Publica logul de build daca a picat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: warn
          retention-days: 3
          path: build/xcodebuild.log

  flows:
    name: flow ${{ matrix.flow }}
    needs: build
    runs-on: macos-26
    # 3 treceri dintr-un flow ≈ 4-5 min + instalarea Maestro/simulatorului ≈ 2 min.
    timeout-minutes: 45
    strategy:
      # Un flow picat NU opreste restul: vrem toate cele 36 de rezultate intr-o singura rulare.
      fail-fast: false
      # Valuri: 12 joburi pe ACELASI runner macOS. Fara limita, ultimele flow-uri stau in coada si pot fi
      # anulate fara sa apuce sa ruleze (11.10.2026: bible si errors au stat 05:22:47 -> 05:44:32 in coada).
      # Doua valuri de cate 6: toate cele 12 flow-uri apuca sa ruleze intr-o singura rulare.
      max-parallel: 6
      matrix:
        # Cele 12 flow-uri. `set-language-ro.yaml` e PROLOGUL (ruleaza in interiorul fiecarui flow),
        # nu se ruleaza separat.
        flow:
          - home
          - prayers
          - calendar
          - bible
          - chat
          - account
          - auth
          - live
          - premium
          - legal
          - notifications
          - errors
    env:
      FLOW: ${{ matrix.flow }}
    steps:
      - uses: actions/checkout@v4

      - name: Descarca .app-ul construit
        uses: actions/download-artifact@v4
        with:
          name: ios-sim-app

      - name: Instaleaza Maestro
        run: |
          set -e
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Porneste simulatorul si instaleaza aplicatia
        run: |
          set -e
          ditto -x -k ios-sim-app.zip app-dir
          APP=$(ls -d app-dir/*.app | head -1)
          DEVICE_UDID=$(xcrun simctl list devices available \
            | grep -E "iPhone .*\(([0-9A-F-]{36})\)" \
            | head -1 \
            | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$DEVICE_UDID" ]; then
            echo "NU am gasit niciun simulator iPhone disponibil. Lista completa:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          echo "Simulator: $DEVICE_UDID"
          echo "Aplicatie: $APP"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP"

      - name: Ruleaza flow-ul "${{ matrix.flow }}" in ${{ env.IOS_PASSES }} treceri
        run: |
          # GitHub Actions ruleaza scriptul cu `bash -e`, deci fara `set +e` prima trecere picata
          # omoara scriptul INAINTE de `case "$code" in` si restul trecerilor nu mai ruleaza.
          set +e
          set -uo pipefail
          export PATH="$PATH:$HOME/.maestro/bin"
          mkdir -p ci-screenshots
          : > flow-results.txt
          : > retry-log.txt
          FAILED=""
          PASSES="${IOS_PASSES:-3}"
          F="maestro/${FLOW}.yaml"
          if [ ! -f "$F" ]; then
            echo "::error::flow inexistent: $F"
            exit 1
          fi
          for pass in $(seq 1 "$PASSES"); do
            MARCA=""
            echo "======== pass$pass Maestro: $FLOW ========"
            mkdir -p "ci-screenshots/pass$pass"
            # ATENTIE: flagurile corecte sunt --format JUNIT si --output. Cu "-o" Maestro raspunde
            # "Unknown option: '-o'", iese cu cod 2 si NU ruleaza niciun flow (patit 11.10.2026).
            maestro --device "$DEVICE_UDID" test "$F" \
              --format JUNIT --output "maestro-pass$pass-$FLOW.xml" \
              --debug-output "maestro-pass$pass-$FLOW-debug"
            code=$?
            if [ "$code" -ne 0 ]; then
              # DOVADA pentru diagnostic: arborele de accesibilitate exact in momentul picarii + JUnit-ul
              # incercarii 1. Fara ele, fiecare incercare pe macOS e oarba (11.10.2026).
              cp -f "maestro-pass$pass-$FLOW.xml" "maestro-pass$pass-$FLOW.incercarea1.xml" 2>/dev/null || true
              maestro --device "$DEVICE_UDID" hierarchy --compact > "hierarchy-pass$pass-$FLOW.incercarea1.txt" 2>&1 || true
              maestro --device "$DEVICE_UDID" hierarchy --compact > "hierarchy-pass$pass-$FLOW.txt" 2>&1 || true
              # CLASIFICAREA CAUZEI (varianta (b), decizia ownerului 13.10.2026):
              #   MOARTE DE MEDIU (driver XCUITest picat) => se reface DOAR trecerea aceea, O SINGURA DATA,
              #     si se consemneaza PASS-MEDIU - poarta NU o numara ca trecere curata;
              #   PICARE DE FLOW (orice alt esec) => NU se reia: trecerea e PICATA, seria se reia de la 1.
              # Dovada reala care a cerut regula: maestro-pass1-errors.incercarea1.xml (run 38367884698):
              #   "DeviceUnreachableException: Device became unreachable during setPermissions" +
              #   "java.net.ConnectException: Failed to connect to /127.0.0.1:51661".
              if grep -qE 'DeviceUnreachableException|Device became unreachable|DeviceServerDied|driver did not start up|Failed to connect to /127\.0\.0\.1|Unable to connect to the device' "maestro-pass$pass-$FLOW.incercarea1.xml"; then
                printf 'trecerea %s: MOARTE DE MEDIU (driver XCUITest) - se reface O SINGURA DATA\n' "$pass" >> retry-log.txt
                maestro --device "$DEVICE_UDID" test "$F" \
                  --format JUNIT --output "maestro-pass$pass-$FLOW.xml" \
                  --debug-output "maestro-pass$pass-$FLOW-debug"
                code=$?
                cp -f "maestro-pass$pass-$FLOW.xml" "maestro-pass$pass-$FLOW.incercarea2.xml" 2>/dev/null || true
                if [ "$code" -eq 0 ]; then MARCA=" (refacut din cauza de mediu)"; else MARCA=" (moarte de mediu si la refacere)"; fi
              else
                printf 'trecerea %s: incercarea 1 a picat (exit %s) - trecerea e PICATA, NU se reia; dovada: maestro-pass%s-%s.incercarea1.xml + hierarchy-pass%s-%s.incercarea1.txt\n' \
                  "$pass" "$code" "$pass" "$FLOW" "$pass" "$FLOW" >> retry-log.txt
              fi
            fi
            case "$code" in
              0) printf 'pass%s\t%s\tPASS%s\n' "$pass" "$FLOW" "$MARCA" >> flow-results.txt ;;
              1) printf 'pass%s\t%s\tFAIL (flow, exit 1)\n' "$pass" "$FLOW" >> flow-results.txt; FAILED="$FAILED pass$pass" ;;
              2) printf 'pass%s\t%s\tEROARE CLI (exit 2): comanda Maestro e gresita, flow-ul NU a rulat\n' "$pass" "$FLOW" >> flow-results.txt; FAILED="$FAILED pass$pass" ;;
              *) printf 'pass%s\t%s\tFAIL (exit %s)\n' "$pass" "$FLOW" "$code" >> flow-results.txt; FAILED="$FAILED pass$pass" ;;
            esac
            ls -l "maestro-pass$pass-$FLOW.xml" 2>/dev/null || echo "  (nu s-a produs maestro-pass$pass-$FLOW.xml)"
            xcrun simctl io "$DEVICE_UDID" screenshot "ci-screenshots/pass$pass/$FLOW.png" || true
          done
          echo "======== REZULTAT pentru $FLOW ========"
          cat flow-results.txt
          TOTAL=$(wc -l < flow-results.txt | tr -d ' ')
          PASSED=$(grep -c 'PASS' flow-results.txt)
          echo "TOTAL=$TOTAL  PASS=$PASSED  FAIL=$(( TOTAL - PASSED ))  ASTEPTAT=$PASSES"
          # POARTA 1: numarul de rezultate pentru acest flow. O lista incompleta NU e niciodata verde.
          if [ "$TOTAL" -ne "$PASSES" ]; then
            echo "::error::ma asteptam la $PASSES rezultate pentru $FLOW, am $TOTAL."
            exit 1
          fi
          # POARTA 2: nicio trecere picata.
          if [ -n "$FAILED" ]; then
            echo "::error::FLOW PICAT: $FLOW ($FAILED)"
            exit 1
          fi
          echo "flow $FLOW: toate cele $PASSES treceri au trecut."

      - name: Colecteaza logul aplicatiei (cauza esecurilor)
        # DE CE: JUnit-ul spune UNDE a picat o asertiune, nu DE CE. Aplicatia isi scrie singura starea
        # cererii de chat intr-o linie stabila (`[chat-latency]`, src/lib/chat-latency.ts):
        #   `[chat-latency] exceptie <ms> ms`                     -> exceptie in traseul de trimitere
        #   `[chat-latency] stream intrerupt <ms> ms (network)`   -> reteaua (limita de mediu CI)
        # Ruleaza MEREU (nu doar la esec): dovada instrumentului trebuie sa existe si pe o rulare
        # verde, altfel "instrumentul merge" nu se poate citi din artefact.
        if: always()
        run: |
          set +e
          UDID="${DEVICE_UDID:-booted}"
          # (1) FISIERUL scris de instrument in containerul de date al aplicatiei. Acesta NU depinde de
          # ce colecteaza logul sistemului (in build-ul de RELEASE logul a dat 0 linii `[chat-latency]`,
          # masurat 13.10.2026 pe rularea 38367884698), deci este canalul pe care se sprijina dovada.
          APP=$(ls -d app-dir/*.app 2>/dev/null | head -1)
          : > chat-latency-fisier.txt
          if [ -n "$APP" ]; then
            BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" 2>/dev/null)
            echo "pachet: ${BUNDLE:-<necunoscut>}"
            if [ -n "$BUNDLE" ]; then
              CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data 2>/dev/null)
              echo "container de date: ${CONTAINER:-<negasit>}"
              if [ -n "$CONTAINER" ]; then
                ls -l "$CONTAINER/Documents" 2>/dev/null || echo "  (nu pot lista Documents)"
                cp "$CONTAINER/Documents/chat-latency.log" chat-latency-fisier.txt 2>/dev/null \
                  || echo "  (fisierul Documents/chat-latency.log nu exista)"
              fi
            fi
          fi
          echo "======== [chat-latency] din FISIERUL aplicatiei ========"
          grep -F '[chat-latency]' chat-latency-fisier.txt || echo "  (nicio linie [chat-latency] in fisier)"
          # (2) Canalul vechi (logul sistemului), pastrat pentru comparatie.
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'eventMessage CONTAINS "chat-latency"' > chat-latency.txt 2>&1
          echo "======== [chat-latency] (starea cererii de chat) ========"
          grep -F '[chat-latency]' chat-latency.txt || echo "  (nicio linie [chat-latency])"
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'processImagePath CONTAINS "Ortodoxia" OR senderImagePath CONTAINS "Ortodoxia"' \
            > app-log.txt 2>&1
          ls -l chat-latency.txt chat-latency-fisier.txt app-log.txt

      - name: Publica dovezile flow-ului
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.flow }}-dovezi
          if-no-files-found: warn
          retention-days: 7
          path: |
            maestro-pass*.xml
            maestro-pass*.incercarea1.xml
