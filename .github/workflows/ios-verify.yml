  poarta:
    name: Poarta - toate cele 36 de rezultate
    needs: [flows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuza suita daca orice flow a picat sau nu a rulat
        run: |
          set -e
          echo "rezultatul joburilor de flow-uri: ${{ needs.flows.result }}"
          if [ "${{ needs.flows.result }}" != "success" ]; then
            echo "::error::Cel putin un flow a picat sau nu a produs toate cele 3 rezultate. Suita NU e verde."
            exit 1
          fi
          echo "VERDE: 12 flow-uri x 3 treceri = 36 de rezultate, zero picate."
