# Codemagic CI/CD — Ortodoxia iOS -> TestFlight
#
# DE CE EXISTĂ: cota EAS Free de build-uri iOS e epuizată (reset 1 nov 2026) și planul plătit
# nu e activ. Codemagic are 500 min macOS/lună gratis pe planul Individual.
#
# SEMNARE — deliberat MANUALĂ, cu certificatul și profilul NOSTRU (nu `fetch-signing-files`):
# grupul `appstore_credentials` conține DIST_CERT_P12_B64 + DIST_CERT_P12_PASSWORD (Apple
# Distribution al nostru) și PROFILE_B64 (profilul App Store pentru ro.ortodoxia.app, cu
# Push Notifications + Sign In with Apple). Motivul e o eroare reală din buildul 6acb2d11:
#   error: "Ortodoxia" requires a provisioning profile with the Push Notifications and
#   Sign In with Apple features.        (după `fetch-signing-files --create`, care luase
#   alt profil de pe portal — profilul EAS 9D7RH2742F, semnat cu certificatul EAS).
# Pașii corecți sunt cei din docs.codemagic.io/yaml-code-signing/alternative-code-signing-methods
# (keychain initialize -> base64 --decode p12 + keychain add-certificates ->
#  profil în $HOME/Library/MobileDevice/Provisioning Profiles -> xcode-project use-profiles).
# `xcode-project use-profiles` NU descarcă nimic de pe portal: citește doar profilul local,
# deci singurul candidat pentru ro.ortodoxia.app este profilul nostru.
#
# ATENȚIE (dovedit, nu presupus): numele proiectului Xcode NU este "OrtodoxiaAI".
# `expo prebuild` redenumește șablonul `expo-template-bare-minimum` (care conține
# ios/HelloWorld.xcodeproj + ios/HelloWorld.xcodeproj/xcshareddata/xcschemes/HelloWorld.xcscheme)
# înlocuind "HelloWorld" cu numele sanitizat din app.json: app.json -> "name": "Ortodoxia".
# Dovezi:
#   - node_modules/expo/node_modules/@expo/cli/build/src/utils/npm.js:159-174 (renameNpmTarballEntries:
#     input.replace(/HelloWorld/g, iosName), iosName = XcodeUtils.sanitizedName(expName))
#   - node_modules/@expo/config-plugins/build/ios/utils/Xcodeproj.js (sanitizedName("Ortodoxia") = "Ortodoxia")
#   - `npm pack expo-template-bare-minimum@sdk-57` -> package/ios/HelloWorld.xcodeproj/xcshareddata/xcschemes/HelloWorld.xcscheme
# Deci după prebuild: ios/Ortodoxia.xcodeproj, schemă partajată "Ortodoxia", iar `pod install`
# (rulat automat de prebuild) generează ios/Ortodoxia.xcworkspace.
#
# Fără secrete aici: XCODE_*, BUNDLE_ID și valorile EXPO_PUBLIC_* sunt publice (ajung oricum în
# bundle-ul JS). Cheile de semnare Apple vin exclusiv din grupul de mediu `appstore_credentials`.

workflows:
  ios-testflight:
    name: Ortodoxia iOS -> TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      node: 22
      vars:
        BUNDLE_ID: "ro.ortodoxia.app"
        XCODE_WORKSPACE: "ios/Ortodoxia.xcworkspace"
        XCODE_SCHEME: "Ortodoxia"
        APP_BUILD_NUMBER: "21"
      # Valorile publice EXPO_PUBLIC_* + ENVIRONMENT se scriu în .env de scriptul de mai jos
      # (exact valorile din .env-ul local / profilul EAS "production").
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Write .env for Expo
        script: |
          set -e
          cat > .env <<'EOF'
          EXPO_PUBLIC_SUPABASE_URL=https://pgjabfgibdpcomegkojg.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_jUBqWb3gn6ZDOcUuNJbVKg_CwswrjQr
          EXPO_PUBLIC_REVENUECAT_APPLE_API_KEY=appl_voOlpavdeOGYDVBEdGegdUTFUbh
          EXPO_PUBLIC_REVENUECAT_GOOGLE_API_KEY=goog_EIZcHpAwRfOaqQRPjfMGlXOvvGo
          EXPO_PUBLIC_LEGAL_ENTITY=YAC PLANET S.R.L., CUI 50636986, Reg. Com. J2024027573006
          EXPO_PUBLIC_SUPPORT_EMAIL=yacplanet@ortodoxiaapp.anonaddy.com
          EXPO_PUBLIC_LEGAL_POSTAL_ADDRESS=Sat Dăești, Comuna Dăești, Strada Calea lui Traian, Nr. 75, Județul Vâlcea
          EXPO_PUBLIC_LEGAL_JURISDICTION=România
          EXPO_PUBLIC_LEGAL_LOCALITY=Dăești, Județul Vâlcea
          EXPO_PUBLIC_LEGAL_EFFECTIVE_DATE=23 septembrie 2026
          EXPO_PUBLIC_PRIVACY_POLICY_URL=https://ortodoxia.web.app/privacy
          EXPO_PUBLIC_TERMS_URL=https://ortodoxia.web.app/terms
          ENVIRONMENT=production
          EOF
          echo "--- chei scrise in .env:"
          sed 's/=.*//' .env
      - name: Expo prebuild (generate ios/)
        script: npx expo prebuild --platform ios --clean
      - name: Set build number
        script: cd ios && agvtool new-version -all "$APP_BUILD_NUMBER"
      - name: Initialize keychain
        script: keychain initialize
      - name: Install our distribution certificate and profile
        script: |
          set -e
          echo "$DIST_CERT_P12_B64" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$DIST_CERT_P12_PASSWORD"
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILES_HOME/ortodoxia_appstore.mobileprovision"
          ls -la "$PROFILES_HOME"
      - name: Apply profiles
        script: xcode-project use-profiles
      - name: Build ipa
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        # Autentificare prin variabilele din grupul `appstore_credentials`
        # (sintaxa din docs.codemagic.io/yaml-publishing/app-store-connect).
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  # ────────────────────────────────────────────────────────────────────────────────────────────────
  # ios-verify — verificarea automată pe SIMULATOR iOS, fără TestFlight și fără telefonul ownerului.
  #
  # DE CE EXISTĂ: până acum, singurul mod de a vedea dacă playerul LIVE chiar încarcă pe iOS era să
  # urci build-ul în TestFlight și să-l deschizi pe iPhone. Defectul „WebView-ul primește about:blank"
  # (build-urile 11–20) a trecut de fiecare dată prin poarta manuală. Workflow-ul acesta rulează
  # ACELEAȘI flow-uri Maestro ca pe Android local (`maestro/*.yaml`), direct pe simulatorul din CI.
  #
  # NU PUBLICĂ NIMIC: nu are secțiune `publishing`, nu atinge TestFlight și nu are nevoie de grupul
  # de secrete `appstore_credentials` — construieste pentru simulator (`-sdk iphonesimulator`).
  # CORECTIE 12.10.2026: afirmatia „pentru simulator semnarea nu e necesara" era GRESITA.
  # Aplicatia porneste si nesemnata, dar securityd refuza atunci seiful (Code=-34018), iar
  # sesiunea de chat traieste in seif. De aceea .app-ul se semneaza ad-hoc, cu entitlementurile
  # de seif, inainte de instalare (pasul „Semneaza .app-ul de simulator").
  #
  # SE PORNEȘTE MANUAL din interfața Codemagic (nu are secțiune `triggering`) și NU în același timp
  # cu `ios-testflight`: regula noastră e să nu consumăm două instanțe de macOS în paralel.
  #
  # CONFIGURAȚIA Release, NU Debug (dovedit, nu presupus): o aplicație React Native construită în
  # Debug cere un server Metro care rulează (localhost:8081) și, fără el, pornește cu ecranul roșu
  # „Unable to load script". În Release, bundle-ul JS e împachetat în aplicație (faza „Bundle React
  # Native code and images" a proiectului Xcode), deci aplicația e completă singură — exact cum
  # ajunge la utilizator. Valorile EXPO_PUBLIC_* se lipesc în bundle la momentul construirii, din
  # .env-ul scris mai jos.
  #
  # ADAUGAT 12.10.2026 (la cererea ownerului, dupa epuizarea minutelor GitHub Actions):
  # verificarea iOS revine in Codemagic, pe ACEEASI configuratie pe care a rulat build-ul
  # 6acbc32ff7b30c6968529f8f (mac_mini_m2, Xcode 26.6 implicit, max 90 min).
  #
  # DOUA CORECTII fata de varianta aceea, amandoua dovedite, nu presupuse:
  #  1. `maestro ... --format junit -o fisier` NU exista: Maestro raspunde "Unknown option: '-o'",
  #     iese cu cod 2 si NU ruleaza niciun flow. In build-ul 6acbc32f toate cele 4 flow-uri au
  #     iesit asa (dovada: flow-results.txt + step-9-0.log din artefacte), desi build-ul .app si
  #     pornirea simulatorului trecusera. Forma corecta este `--format JUNIT --output fisier`.
  #  2. Pasul de build nu mai filtreaza cu `| tail -n 60`: pe 11.10.2026 exact filtrul acesta a
  #     ascuns eroarea reala (exit 65 fara nicio explicatie in log). Acum scrie tot in
  #     build/xcodebuild.log si publica fisierul ca artefact.
  #
  # PASII DE DIAGNOZA veniti din workflow-ul GitHub (mutati aici, nu copiati in doua locuri):
  # logul aplicatiei din simulator + `chat-latency.txt` + proba `curl` pe endpointul de sanatate
  # Supabase (fara sa consume cota AI). Ei decid cauza cand un flow cade fara sa spuna de ce.
  ios-verify:
    name: Ortodoxia iOS - verificare pe simulator (Maestro, fara publicare)
    # 120 min = MAXIMUL pe care il accepta platforma. Ownerul a cerut 180, dar Codemagic respinge
    # build-ul cu "Configuration error": "Invalid value for workflows -> ios-verify ->
    # max_build_duration, value 180 is out of expected bounds (1, 120)" (dovedit 12.10.2026, build
    # 6accd76433ef135cd9f1025c, respins inainte de a porni). Deci 120, cat se poate.
    # Marja: ultimul ios-verify reusit (6acc8e1c, 4 flow-uri) a tinut 34 min, din care 23 min build-ul
    # .app-ului si ~1,7 min per rulare de flow; 36 de rulari + build ~= 95-100 min, sub plafon.
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      # Maestro 2.x are nevoie de un JVM modern (17+); imaginea implicita poate aduce altceva.
      java: 21
      vars:
        BUNDLE_ID: "ro.ortodoxia.app"
        XCODE_WORKSPACE: "ios/Ortodoxia.xcworkspace"
        XCODE_SCHEME: "Ortodoxia"
        APP_BUILD_NUMBER: "21"
        MAESTRO_CLI_NO_ANALYTICS: "1"
        # (a) SUBSET DE FLOW-URI: gol = TOATE flow-urile din maestro/ (mai putin prologul).
        # Se poate suprascrie la pornirea build-ului (API: environment.variables, sau
        # "Start new build" din Codemagic), fara sa se editeze fisierul, ex. "chat,live".
        IOS_FLOWS: ""
        # Numar de treceri: 3 = verificarea finala (cerinta owner). Pentru sondaje: 1 sau 2.
        IOS_PASSES: "3"
    scripts:
      - name: Verifica toolchain-ul (Xcode, Java, Node)
        script: |
          set -e
          # Garda, nu presupunere: fara ea fiecare rulare e oarba la toolchain. Pe 11.10.2026 s-au
          # pierdut 5 rulari pe Xcode/Swift prea vechi (cele doua manifeste SwiftPM cer 6.2) si pe
          # bugul upstream expo/expo#50061. Build-ul .app a trecut pe toate cu Xcode 26.6.
          xcodebuild -version
          java -version
          node --version
      - name: Install npm dependencies
        script: npm ci
      - name: Write .env for Expo
        script: |
          set -e
          cat > .env <<'EOF'
          EXPO_PUBLIC_SUPABASE_URL=https://pgjabfgibdpcomegkojg.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_jUBqWb3gn6ZDOcUuNJbVKg_CwswrjQr
          EXPO_PUBLIC_REVENUECAT_APPLE_API_KEY=appl_voOlpavdeOGYDVBEdGegdUTFUbh
          EXPO_PUBLIC_REVENUECAT_GOOGLE_API_KEY=goog_EIZcHpAwRfOaqQRPjfMGlXOvvGo
          EXPO_PUBLIC_LEGAL_ENTITY=YAC PLANET S.R.L., CUI 50636986, Reg. Com. J2024027573006
          EXPO_PUBLIC_SUPPORT_EMAIL=yacplanet@ortodoxiaapp.anonaddy.com
          EXPO_PUBLIC_LEGAL_POSTAL_ADDRESS=Sat Dăești, Comuna Dăești, Strada Calea lui Traian, Nr. 75, Județul Vâlcea
          EXPO_PUBLIC_LEGAL_JURISDICTION=România
          EXPO_PUBLIC_LEGAL_LOCALITY=Dăești, Județul Vâlcea
          EXPO_PUBLIC_LEGAL_EFFECTIVE_DATE=23 septembrie 2026
          EXPO_PUBLIC_PRIVACY_POLICY_URL=https://ortodoxia.web.app/privacy
          EXPO_PUBLIC_TERMS_URL=https://ortodoxia.web.app/terms
          ENVIRONMENT=production
          EOF
          echo "--- chei scrise in .env:"
          sed 's/=.*//' .env
      - name: Expo prebuild (generate ios/)
        script: |
          set -euo pipefail
          npx expo prebuild --platform ios --clean
          # ATENTIE (dovedit 11.10.2026): `expo prebuild` iese cu cod 0 chiar daca `pod install` a
          # esuat, deci pasul pare verde si urmatorul cade pe un workspace inexistent. Verificam
          # explicit ca pod install a produs workspace-ul.
          test -d ios/Ortodoxia.xcworkspace || {
            echo "pod install nu a produs ios/Ortodoxia.xcworkspace (vezi liniile de mai sus)."
            exit 1
          }
          ls -d ios/Ortodoxia.xcworkspace
      - name: Set build number
        script: cd ios && agvtool new-version -all "$APP_BUILD_NUMBER"
      - name: Build .app pentru simulator (Release, semnat de Xcode pentru simulator)
        script: |
          set -uo pipefail
          mkdir -p build
          LOG=build/xcodebuild.log
          set +e
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios-sim \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            build > "$LOG" 2>&1
          CODE=$?
          set -e
          echo "xcodebuild exit code: $CODE"
          grep -n -E "error:|fatal error|Undefined symbol|ld: |\*\* BUILD FAILED \*\*|Command .* failed" "$LOG" | head -60 || true
          if [ "$CODE" -ne 0 ]; then
            echo "xcodebuild a picat (exit $CODE). Ultimele 80 de linii din $LOG:"
            tail -n 80 "$LOG"
            exit "$CODE"
          fi
          ls -d build/ios-sim/Build/Products/Release-iphonesimulator/*.app
      # DOVEDIT 12.10.2026 (doua rulari, aceeasi zi):
      #   (1) rularea 6acc66cd6ee1b7ed0789c5fa - build NEsemnat (CODE_SIGNING_ALLOWED=NO):
      #       .app-ul nu are niciun entitlement, deci securityd refuza orice acces la seif
      #       (Code=-34018, textul integral in raportul PARTII 1), sesiunea de oaspete nu se
      #       putea scrie, iar flow-ul `chat` cadea inainte sa trimita vreo cerere.
      #   (2) rularea 6acc7ebd9fd7afd6154394cc - .app semnat DE MANA peste build-ul nesemnat
      #       (codesign --force --sign - --entitlements ...): toate cele 4 flow-uri au picat la
      #       `launchApp` cu "Simulator device failed to launch ro.ortodoxia.app. The request
      #       was denied by service delegate (SBMainWorkspace)", crashFile=none. Semnarea manuala
      #       a pachetului a stricat lansarea, deci NU se mai foloseste.
      # SOLUTIA (o singura schimbare): build-ul de simulator se face asa cum il face Xcode in mod
      # normal pentru simulator - semnare pornita, identitate ad-hoc ("-" = Sign to Run Locally),
      # fara echipa si fara profil - si pachetul NU se mai modifica dupa build. In configuratia
      # asta (cea standard, sub care ruleaza orice proiect React Native pe simulator) Xcode
      # semneaza aplicatia si codul imbricat (cadrele din Frameworks) consecvent, iar
      # entitlementurile derivate (`application-identifier`, `get-task-allow`) fac seiful de chei
      # accesibil. Pasul de mai jos doar VERIFICA si publica dovada; nu modifica nimic.
      - name: Verifica semnatura .app-ului de simulator (conditia pentru seif)
        script: |
          set -uo pipefail
          APP=$(ls -d build/ios-sim/Build/Products/Release-iphonesimulator/*.app | head -1)
          {
            echo "== aplicatia: $APP"
            echo "== identitatea semnaturii (codesign -dv):"
            codesign -dv --verbose=2 "$APP" 2>&1 || true
            echo "== entitlementurile din semnatura:"
            codesign -d --entitlements - "$APP" 2>&1 || true
            echo "== verificare semnatura:"
            codesign --verify --strict "$APP" 2>&1 && echo "semnatura verificata" || true
            echo "== conditia pentru seif (application-identifier):"
            if codesign -d --entitlements - "$APP" 2>/dev/null | grep -q "application-identifier"; then
              echo "PREZENT: aplicatia poate folosi seiful de chei."
            else
              echo "LIPSA: fara application-identifier, securityd refuza seiful (Code=-34018)."
            fi
          } > entitlements.txt 2>&1
          cat entitlements.txt
      - name: Download Maestro
        script: |
          set -e
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version
      - name: Pornire simulator iOS si instalare aplicatie
        script: |
          set -e
          # Alegem primul iPhone disponibil din lista de simulatoare, fara sa ghicim numele
          # (numele depinde de versiunea de Xcode de pe imaginea de build).
          DEVICE_UDID=$(xcrun simctl list devices available \
            | grep -E "iPhone .*\(([0-9A-F-]{36})\)" \
            | head -1 \
            | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$DEVICE_UDID" ]; then
            echo "NU am gasit niciun simulator iPhone disponibil. Lista completa:"
            xcrun simctl list devices available
            exit 1
          fi
          APP=$(ls -d build/ios-sim/Build/Products/Release-iphonesimulator/*.app | head -1)
          echo "DEVICE_UDID=$DEVICE_UDID" >> $CM_ENV
          echo "APP=$APP" >> $CM_ENV
          echo "Simulator: $DEVICE_UDID"
          echo "Aplicatie: $APP"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP"
      - name: Ruleaza flow-urile Maestro pe simulator (implicit 3 treceri, subset prin IOS_FLOWS)
        script: |
          # NU iese cu eroare aici, chiar daca un flow cade: altfel Codemagic opreste build-ul
          # INAINTE de pasul de diagnoza si de publicarea artefactelor, adica exact cand ai nevoie
          # de ele (patit: un singur flow picat = zero dovezi). Poarta de iesire e ultimul pas.
          #
          # (a) LISTA DE FLOW-URI: implicit TOATE flow-urile din maestro/ (mai putin prologul, care e
          # chemat prin `runFlow`), dar se poate cere un SUBSET din afara, fara sa se editeze fisierul:
          # se transmite variabila de mediu IOS_FLOWS (acceptate si FLOWS / MAESTRO_FLOWS) la pornirea
          # build-ului, fie prin API - {"environment":{"variables":{"IOS_FLOWS":"chat,live"}}} - fie
          # din butonul "Start new build" al Codemagic. Numele se dau fara ".yaml", separate prin
          # virgula, spatiu sau punct-virgula; "all" = toate. Un nume inexistent e EROARE, nu se
          # ignora in tacere (altfel un typo da o rulare "verde" cu flow-uri lipsa).
          #
          # (b) RELUIRE O SINGURA DATA: daca un flow cade la prima incercare (INCONCLUCENT: device
          # server mort, "element not found" dupa un timeout FARA octeti primiti etc.), acelasi flow
          # se ruleaza a DOUA oara in aceeasi trecere, cu JUnit si captura separate, iar in
          # flow-results.txt ramane scris negru pe alb ca a fost nevoie de reluare (nu se ascunde).
          # Reluarea NU se face la exit 2 (eroare de CLI: comanda Maestro e gresita, deci inca ~2
          # minute ar fi pierdute degeaba) si NU slabeaza nimic: doar repeta flow-ul neschimbat.
          set -uo pipefail
          export PATH="$PATH:$HOME/.maestro/bin"
          : > flow-results.txt
          : > flow-retries.txt
          FAILED=""
          RETRY_LIST=""

          ALL_FLOWS=$(ls -1 maestro/*.yaml 2>/dev/null | grep -v -E '/set-language-ro\.yaml$' | sort)
          if [ -z "$ALL_FLOWS" ]; then
            echo "EROARE: niciun flow de rulat in maestro/ (in afara de prolog)."
            FAILED="LISTA-GOALA"
          fi

          CERUTE="${IOS_FLOWS:-${FLOWS:-${MAESTRO_FLOWS:-}}}"
          FLOWS=""
          if [ -n "$CERUTE" ]; then
            echo "======== SUBSET CERUT PRIN VARIABILA DE MEDIU: $CERUTE ========"
            for n in $(printf '%s' "$CERUTE" | tr ',' ' ' | tr ';' ' '); do
              if [ "$n" = "all" ] || [ "$n" = "toate" ]; then
                FLOWS="$ALL_FLOWS"
                break
              fi
              if [ ! -f "maestro/$n.yaml" ]; then
                echo "EROARE: flow cerut inexistent: $n (nu exista maestro/$n.yaml)"
                FAILED="$FAILED LISTA:$n"
                continue
              fi
              FLOWS="$FLOWS maestro/$n.yaml"
            done
            if [ -z "$FLOWS" ]; then
              echo "EROARE: subsetul cerut nu a dat niciun flow valid."
              FAILED="$FAILED LISTA-SUBSET"
            fi
          else
            echo "======== LISTA IMPLICITA: TOATE flow-urile din maestro/ ========"
            FLOWS="$ALL_FLOWS"
          fi

          # Numarul de treceri: implicit 3 (cerinta owner: 3 treceri complete = verificarea finala).
          # Pentru sondaje se poate cere 1 sau 2 din variabila de mediu IOS_PASSES (ex. IOS_FLOWS=chat
          # cu IOS_PASSES=1), ca sa nu ardem 3 treceri pe fiecare verificare intermediara.
          PASSES="${IOS_PASSES:-3}"
          case "$PASSES" in
            1|2|3) ;;
            *) echo "EROARE: IOS_PASSES trebuie sa fie 1, 2 sau 3 (primit: $PASSES)."
               FAILED="$FAILED IOS_PASSES-INVALID"; PASSES=3 ;;
          esac

          NF=$(printf '%s\n' $FLOWS | grep -c .)
          printf 'flows=%s\npasses=%s\n' "$NF" "$PASSES" > ci-expected.txt
          echo "======== FLOW-URI DE RULAT ($NF) x $PASSES TRECERI ========"
          printf '%s\n' $FLOWS

          for pass in $(seq 1 "$PASSES"); do
            echo "======== TRECEREA $pass/$PASSES ========"
            mkdir -p "ci-junit/pass$pass" "ci-screenshots/pass$pass"
            for f in $FLOWS; do
              name=$(basename "$f" .yaml)
              echo "======== Maestro: trecerea $pass, flow $name ========"
              # ATENTIE: flagurile corecte sunt --format JUNIT si --output. Cu "-o" Maestro raspunde
              # "Unknown option: '-o'", iese cu cod 2 si NU ruleaza niciun flow (dovedit 11.10.2026,
              # build 6acbc32f: toate cele 4 flow-uri au iesit asa).
              maestro --device "$DEVICE_UDID" test "$f" \
                --format JUNIT --output "ci-junit/pass$pass/$name.xml" \
                --debug-output "maestro-pass$pass-$name-debug"
              code=$?
              if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
                # Dovada primei incercari, INAINTE de reluare (altfel se pierd exact dovezile flake-ului).
                maestro --device "$DEVICE_UDID" hierarchy --compact > "hierarchy-pass$pass-$name-incercare1.txt" 2>&1 || true
                xcrun simctl io "$DEVICE_UDID" screenshot "ci-screenshots/pass$pass/$name-incercare1.png" || true
                printf 'trecerea %s\t%s\tINCONCLUCENT la incercarea 1 (exit %s) -> RELUIRE O SINGURA DATA\n' "$pass" "$name" "$code" >> flow-results.txt
                RETRY_LIST="$RETRY_LIST $name/pass$pass"
                echo "======== RELUIRE (a doua incercare): flow $name, trecerea $pass ========"
                maestro --device "$DEVICE_UDID" test "$f" \
                  --format JUNIT --output "ci-junit/pass$pass/$name-reluare.xml" \
                  --debug-output "maestro-pass$pass-$name-reluare-debug"
                code=$?
              fi
              if [ "$code" -eq 0 ]; then
                printf 'trecerea %s\t%s\tPASS\n' "$pass" "$name" >> flow-results.txt
              else
                case "$code" in
                  2) printf 'trecerea %s\t%s\tEROARE CLI (exit 2): comanda Maestro e gresita, flow-ul NU a rulat\n' "$pass" "$name" >> flow-results.txt ;;
                  *) printf 'trecerea %s\t%s\tFAIL (flow, exit %s)\n' "$pass" "$name" "$code" >> flow-results.txt ;;
                esac
                FAILED="$FAILED $name/pass$pass"
                # Dovada starii finale: dupa reluare (sau dupa singura incercare, daca nu s-a reluat).
                maestro --device "$DEVICE_UDID" hierarchy --compact > "hierarchy-pass$pass-$name.txt" 2>&1 || true
              fi
              ls -l "ci-junit/pass$pass/$name.xml" 2>/dev/null || echo "  (nu s-a produs ci-junit/pass$pass/$name.xml)"
              xcrun simctl io "$DEVICE_UDID" screenshot "ci-screenshots/pass$pass/$name.png" || true
            done
            echo "======== SFARSITUL TRECERII $pass/$PASSES ========"
          done

          echo "======== REZULTAT PER FLOW ========"
          cat flow-results.txt
          printf '%s\n' "$FAILED" > flow-failed.txt
          if [ -n "$RETRY_LIST" ]; then
            printf '%s\n' $RETRY_LIST > flow-retries.txt
          else
            : > flow-retries.txt
          fi
          if [ -s flow-retries.txt ]; then
            echo "======== RELUARI (INCONCLUCENT la prima incercare) ========"
            cat flow-retries.txt
            echo "  total reluari: $(grep -c . flow-retries.txt || true)"
          else
            echo "======== NICIO RELUARE: toate flow-urile au trecut din prima ========"
          fi
          if [ -n "$FAILED" ]; then
            echo "FLOW-URI PICATE:$FAILED"
          else
            echo "TOATE FLOW-URILE AU TRECUT."
          fi

      - name: Colecteaza logul aplicatiei + proba de retea (cauza esecurilor)
        script: |
          # DE CE: JUnit-ul spune UNDE a picat o asertiune, nu DE CE. Aplicatia isi scrie singura
          # starea cererii de chat intr-o linie stabila (`[chat-latency]`, src/lib/chat-latency.ts):
          #   `[chat-latency] exceptie <ms> ms`                   -> exceptie in traseul de trimitere
          #   `[chat-latency] stream intrerupt <ms> ms (network)`  -> reteaua (limita de mediu CI)
          # Fara acest fisier, fiecare rulare pe macOS e oarba la cauza (12.10.2026: flow-ul `chat`
          # a picat pentru ca aplicatia isi afisase eroarea de serviciu, fara sa se poata spune de ce).
          set +e
          UDID="${DEVICE_UDID:-booted}"
          echo "======== [chat-latency] (starea cererii de chat) ========"
          xcrun simctl spawn "$UDID" log show --last 20m --style compact \
            --predicate 'eventMessage CONTAINS "chat-latency"' > chat-latency.txt 2>&1
          grep -F '[chat-latency]' chat-latency.txt || echo "  (nicio linie [chat-latency])"
          echo "======== logul aplicatiei (context) ========"
          xcrun simctl spawn "$UDID" log show --last 20m --style compact \
            --predicate 'processImagePath CONTAINS "Ortodoxia" OR senderImagePath CONTAINS "Ortodoxia"' \
            > app-log.txt 2>&1
          ls -l chat-latency.txt app-log.txt
          echo "======== securityd (refuzurile de seif ale aplicatiei) ========"
          # securityd NU apare in app-log.txt (parintele procesului e securityd, nu aplicatia),
          # iar refuzul seifului este exact cauza care a tinut flow-ul `chat` rosu pe simulator.
          xcrun simctl spawn "$UDID" log show --last 20m --style compact \
            --predicate 'process == "securityd" AND eventMessage CONTAINS "Ortodoxia"' > securityd-log.txt 2>&1
          N=$(grep -c 'Code=-34018' securityd-log.txt || true)
          echo "  linii Code=-34018 (seif refuzat): ${N:-0}"
          echo "======== proba de retea a masinii de build ========"
          # Endpoint de sanatate Supabase: DNS + TLS + HTTP, FARA sa consume cota AI. Arata daca
          # egress-ul functiona in acel minut.
          SUPABASE_URL=$(grep -E '^[[:space:]]*EXPO_PUBLIC_SUPABASE_URL=' .env | head -1 | cut -d= -f2- | tr -d '\r' | xargs)
          SUPABASE_URL="${SUPABASE_URL:-https://pgjabfgibdpcomegkojg.supabase.co}"
          curl -sS -o /dev/null -w 'auth health: %{http_code} (%{time_total}s)\n' "$SUPABASE_URL/auth/v1/health" || true
          exit 0
      - name: Poarta - iesire cu eroare daca un flow a picat
        script: |
          set -uo pipefail
          FAILED=$(cat flow-failed.txt 2>/dev/null || echo "")
          NF=$(sed -n 's/^flows=//p' ci-expected.txt 2>/dev/null | head -1); NF=${NF:-12}
          NP=$(sed -n 's/^passes=//p' ci-expected.txt 2>/dev/null | head -1); NP=${NP:-3}
          NEXP=$((NF * NP))
          echo "======== CE S-A RULAT: $NF flow-uri x $NP treceri = $NEXP rezultate asteptate ========"
          echo "======== REZULTAT PER FLOW x TRECERE ========"
          cat flow-results.txt
          echo "======== RELUARI (INCONCLUCENT la prima incercare, trecute la a doua) ========"
          if [ -s flow-retries.txt ]; then
            cat flow-retries.txt
            echo "  total: $(grep -c . flow-retries.txt || true)"
          else
            echo "  (niciuna)"
          fi
          echo "======== TOTALURI ========"
          echo "  linii de rezultat: $(grep -c . flow-results.txt || true) (poate depasi $NEXP: fiecare reluare adauga o linie, dar PASSUL ramane unul per flow per trecere)"
          echo "  PASS: $(grep -c 'PASS' flow-results.txt || true)  (asteptat: $NEXP)"
          echo "  JUnit produse: $(ls -1 ci-junit/pass*/*.xml 2>/dev/null | grep -c . || true)"
          echo "  capturi produse: $(ls -1 ci-screenshots/pass*/*.png 2>/dev/null | grep -c . || true)"

          # POARTA STRICTA, PE FISIERE (nu doar pe numaratoare de linii): pentru FIECARE flow si FIECARE
          # trecere, ULTIMA incercare trebuie sa aiba failures="0" in JUnit. Daca exista un JUnit de
          # reluare, acela e autoritar (e ultima incercare). Fara verificarea asta, o reluare ar putea
          # masca un flow care nu a trecut niciodata verde - exact ce nu are voie sa se intample.
          PROBLEME=""
          for pass in $(seq 1 "$NP"); do
            for xml in ci-junit/pass$pass/*.xml; do
              [ -f "$xml" ] || continue
              baza=$(basename "$xml" .xml)
              case "$baza" in *-reluare) continue ;; esac
              if [ -f "ci-junit/pass$pass/$baza-reluare.xml" ]; then
                xml="ci-junit/pass$pass/$baza-reluare.xml"
              fi
              head3=$(head -3 "$xml")
              fails=$(printf '%s\n' "$head3" | sed -n 's/.*failures="\([0-9]*\)".*/\1/p' | head -1)
              tests=$(printf '%s\n' "$head3" | sed -n 's/.*tests="\([0-9]*\)".*/\1/p' | head -1)
              if [ "${fails:-x}" != "0" ]; then
                PROBLEME="$PROBLEME $baza/pass$pass(JUnit failures=${fails:-lipsa})"
              fi
              if [ "${tests:-x}" != "1" ]; then
                PROBLEME="$PROBLEME $baza/pass$pass(JUnit tests=${tests:-lipsa})"
              fi
            done
          done
          if [ -n "$PROBLEME" ]; then
            echo "Poarta: JUnit cu failures!=0 sau tests!=1, ori lipsa:$PROBLEME"
          fi

          if [ -n "$FAILED" ]; then
            echo "FLOW-URI PICATE:$FAILED"
            exit 1
          fi
          if [ "$(grep -c 'PASS' flow-results.txt || true)" -ne "$NEXP" ]; then
            echo "Poarta: NU sunt $NEXP rezultate PASS ($NF flow-uri x $NP treceri)."
            exit 1
          fi
          if [ -n "$PROBLEME" ]; then
            echo "Poarta: cel putin un JUnit nu are failures=\"0\"."
            exit 1
          fi
          if [ "$(ls -1 ci-screenshots/pass*/*.png 2>/dev/null | grep -c . || true)" -lt "$NEXP" ]; then
            echo "Poarta: mai putine capturi decat rezultate asteptate ($NEXP)."
            exit 1
          fi
          echo "TOATE CELE $NEXP DE RULARI ($NF flow-uri x $NP treceri) AU TRECUT, cu JUnit failures=\"0\" si captura."
          if [ -s flow-retries.txt ]; then
            echo "ATENTIE (de raportat obligatoriu): $(grep -c . flow-retries.txt || true) flow-uri au avut nevoie de reluare - vezi flow-retries.txt."
          fi

    artifacts:
      - build/ios-sim/Build/Products/Release-iphonesimulator/*.app
      - build/xcodebuild.log
      - ci-junit/**/*.xml
      - maestro-pass*-*-debug/**
      - flow-results.txt
      - flow-failed.txt
      - flow-retries.txt
      - ci-expected.txt
      - ci-screenshots/**/*.png
      - hierarchy-pass*.txt
      - chat-latency.txt
      - app-log.txt
      - securityd-log.txt
      - entitlements.txt

