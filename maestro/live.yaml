# T1 — Slujbe LIVE: playerul chiar încarcă (regresia „WebView-ul primește about:blank").
#
# CE VERIFICĂ, în ordine:
#   1. ecranul „Slujbe LIVE" se deschide din cardul de pe Acasă;
#   2. lista de surse se încarcă (nu rămâne pe „Se verifică transmisiunile…");
#   3. există o transmisiune LIVE embeddabilă (altfel NU se poate verifica playerul — flow-ul pică aici, spus explicit);
#   4. playerul se deschide și pagina se termină de încărcat (`incarcat=da`), deci NU rămâne pe „Se încarcă playerul video…";
#   5. adresa citită de player NU este `about:blank` (defectul din build-urile 11–20);
#   6. iOS: pagina NOASTRĂ de embed a răspuns (`page-ready`) — singura dovadă că documentul e al nostru;
#      Android: sonda injectată a raportat referrer-ul (`ref=`) de pe pagina YouTube.
#
# TOATE textele de mai jos sunt chei i18n reale (ro) din src/i18n/config.ts, extrase cu scriptul
# extract-i18n.mjs (PowerShell distorsionează diacriticele), nu texte inventate.
#
# ── EXTINS 2026-10-12 (build 22) — ce s-a ADĂUGAT. Nimic din ce era înainte nu s-a șters și nu s-a
#    slăbit; s-au adăugat doar porți noi:
#   a) lista de surse se dovedește prin texte reale, nu doar prin „a apărut TRINITAS TV": subtitlul
#      ecranului (live.subtitle), eticheta furnizorului (live.providerLabel), o stare dintre cele TREI
#      valori posibile ale aplicației (live.statusLive / statusNotLive / statusNoDetection) și absența
#      erorii de status (live.errorStatusFetch);
#   b) playerul chiar a încărcat o PAGINĂ REALĂ, nu doar un eveniment: adresa COMISĂ începe cu https://
#      (nu `about:blank`), adresa CERUTĂ la pornire e un https:// real (`cerut=`, de la onLoadStart),
#      iar WebView-ul și-a măsurat o cutie NEnulă (`webview=<w>x<h>`; când nu a raportat nimic, linia e
#      literal `webview=...` — vezi DIAGNOSTIC_PENDING), deci a avut unde să deseneze;
#   c) playerul nu a raportat nicio eroare proprie (`Eroare player: ...`);
#   d) explicația de jos a ecranului (live.disclaimer) e pe ecran — se derulează la ea abia la final,
#      ca să nu miște lista de sub degetul care apasă „Vezi în direct".
appId: ro.ortodoxia.app
---
- launchApp:
    stopApp: true
# Prolog comun: așază aplicația pe limba ROMÂNĂ (emulatorul/simulatorul e implicit pe engleză,
# iar aplicația urmează limba dispozitivului la prima pornire — altfel aserțiunile de mai jos pică).
- runFlow: set-language-ro.yaml
- extendedWaitUntil:
    visible: ".*(Acasă|Home).*"
    timeout: 45000
    label: "PORȚI: aplicația a pornit (bara de tab-uri e vizibilă)"
# Cardul de pe Acasă are accessibilityLabel = home.liveAccessibilityLabel (unic pe ecran; titlul
# „Slujbe LIVE" apare de două ori, deci NU e un selector sigur).
- scrollUntilVisible:
    element:
      text: ".*Slujbe LIVE — Urmărește Sfânta Liturghie în direct.*"
    direction: DOWN
    timeout: 30000
    label: "cardul LIVE de pe Acasă"
- tapOn: "Slujbe LIVE — Urmărește Sfânta Liturghie în direct"
- extendedWaitUntil:
    visible: ".*TRINITAS TV.*"
    timeout: 60000
    label: "PORȚI: lista de surse s-a încărcat din funcția de status"
- assertNotVisible: ".*Se verifică transmisiunile….*"
# PORȚI. Fără o transmisiune LIVE embeddabilă, playerul NU poate fi deschis, deci nici verificat:
# preferăm un eșec explicit (cu motivul scris) în locul unui „pass" pe un ecran fără player.
- assertVisible:
    text: ".*Vezi în direct.*"
    label: "PORȚI: există o transmisiune LIVE embeddabilă (fără ea, playerul nu poate fi verificat)"
# ── Adăugat 2026-10-12: lista se dovedește prin textele ei reale (nu doar prin prezența unui nume).
- assertVisible:
    text: "Urmărește Sfânta Liturghie în direct de la surse oficiale. Transmisiunile aparțin instituțiilor bisericești respective."
    label: "PORȚI: identitatea ecranului 09 LIVE (subtitlul, care spune și cui aparțin transmisiunile)"
- assertVisible:
    text: "Furnizor: .*"
    label: "PORȚI: fiecare sursă vine cu furnizorul ei (live.providerLabel), nu e un rând gol"
- assertVisible:
    text: "LIVE ACUM|Momentan nu este LIVE|Starea live nu este monitorizată pentru această sursă"
    label: "PORȚI: starea afișată e una dintre cele TREI valori pe care aplicația le poate arăta (niciuna inventată)"
- assertNotVisible:
    text: ".*Nu am putut verifica transmisiunile acum\\..*"
    label: "REGRESIA: funcția de status a răspuns (live.errorStatusFetch nu e pe ecran)"
- tapOn: ".*Vezi în direct.*"
- extendedWaitUntil:
    visible: ".*Deschide pe YouTube.*"
    timeout: 30000
    label: "PORȚI: playerul (suprapunerea video) s-a deschis"
- extendedWaitUntil:
    notVisible: "Se încarcă playerul video.*"
    timeout: 60000
    label: "PORȚI: pagina playerului s-a terminat de încărcat"
- assertVisible: ".*Player YouTube live.*"
# Blocul tehnic e ascuns implicit; butonul care îl arată e 48x48, invizibil, cu etichetă de accesibilitate.
- tapOn: ".*Detalii tehnice despre player.*"
# Maestro compară textul EXACT (regex pe TOT textul nodului), iar linia reală e
# „Pagina playerului: <adresa>", deci aserțiunile care acceptă un sufix se termină cu `.*`.
- assertVisible:
    text: "Pagina playerului: .*"
    label: "blocul tehnic arată adresa COMISĂ a documentului playerului (linia nu e goală)"
- extendedWaitUntil:
    visible: ".*incarcat=da.*"
    timeout: 60000
    label: "POARTĂ: evenimentul de încărcare a venit (pagina chiar s-a terminat de încărcat)"
- assertNotVisible:
    text: ".*about:blank.*"
    label: "REGRESIA: documentul playerului nu are voie să fie about:blank"
# ── Adăugat 2026-10-12: dovada că playerul a încărcat o PAGINĂ REALĂ, nu doar că s-a terminat un eveniment.
- assertVisible:
    text: "Pagina playerului: https://.*"
    label: "PORȚI: documentul COMIS e o pagină https reală (about:blank nu începe cu https://)"
- assertVisible:
    text: "cerut=https://.*"
    label: "PORȚI: cererea a plecat spre o adresă https reală (linia `cerut=`, de la onLoadStart)"
- assertVisible:
    text: "webview=\\d+x\\d+"
    label: "PORȚI: WebView-ul și-a măsurat o cutie NEnulă, deci a avut unde desena (când nu raportează nimic, linia este `webview=...`)"
- assertNotVisible:
    text: ".*Eroare player.*"
    label: "REGRESIA: playerul nu a raportat nicio eroare proprie (linia \"Eroare player: ...\")"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "page=.*page-ready.*"
          timeout: 20000
          label: "iOS: pagina NOASTRĂ de embed (ortodoxia.web.app/live-embed) a răspuns"
      - assertVisible:
          text: "Pagina playerului: https://ortodoxia.web.app/live-embed.*"
          label: "iOS: documentul COMIS este pagina noastră de embed (nu about:blank, nu YouTube)"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "ref=.*"
          timeout: 20000
          label: "Android: sonda injectată a citit referrer-ul paginii YouTube"
- takeScreenshot: live-player
- tapOn: ".*Închide playerul video.*"
- extendedWaitUntil:
    visible: ".*Slujbe LIVE.*"
    timeout: 15000
    label: "ne-am întors pe ecranul LIVE"
- assertNotVisible: ".*Player YouTube live.*"
# ── Adăugat 2026-10-12: explicația de jos a ecranului. Se derulează abia ACUM, la final, ca să nu miște
#    lista înainte de apăsarea pe „Vezi în direct".
- scrollUntilVisible:
    element:
      text: "Transmisiunile aparțin surselor oficiale. Aplicația afișează starea live doar pe baza datelor primite de la server."
    direction: DOWN
    timeout: 20000
    # centerElement: true  <-- SCOS (dovada 13.10.2026: textul e ULTIMUL element de pe ecranul LIVE,
    #   deci nu poate fi centrat; ierarhia salvata la picare, in artefactele rularii GitHub
    #   (pass1 si pass2, flow live), il arata PE ECRAN, in timp ce scrollUntilVisible raporta
    #   "No visible element found". Aceeasi clasa de reparatie ca la legal/terms, DOAR pe pasul dovedit.)
    label: "PORȚI: ecranul își spune limita (live.disclaimer), nu doar promite un player"
- assertVisible:
    text: "Transmisiunile aparțin surselor oficiale. Aplicația afișează starea live doar pe baza datelor primite de la server."
    label: "PORȚI: explicația e pe ecran (live.disclaimer)"
