# T6 — CHAT, STAREA B: cota gratuită epuizată (5 întrebări) ⇒ aplicația se OPRESTE și cere Premium.
#
# CE DOVEDEȘTE (cerința ownerului, 13.10.2026): primele 5 întrebări ale zilei primesc răspuns complet;
# după a 5-a, aplicația nu mai trimite nimic și arată cardul de stop + ofertă Premium. Ambele stări sunt
# reale și separate: starea A (în cotă) e `maestro/chat.yaml`, starea B (cotă epuizată) e ACEST fișier.
# Nu se șterge și nu se slăbește nimic din chat.yaml; aserțiunile de aici se ADAGĂ.
#
# DE UNDE SE ȘTIE CĂ RĂSPUNSUL E COMPLET: sub un răspuns complet al asistentului apare butonul
# „Raportează" (chat.reportButton, `src/app/(tabs)/chat.tsx:837-845`); el nu apare nici pe mesajul
# utilizatorului, nici pe indicatorul „Pregătesc răspunsul...", nici pe textul care sosește în streaming.
#
# CUM ARATĂ STAREA B ÎN COD (citit, nu presupus):
#   `chat.tsx:530-534`  — garda locală `if (remaining <= 0) { setErrorMessage(...); return; }` oprește
#                         cererea ÎNAINTE de plecare, deci al 6-lea mesaj nu ajunge la server;
#   `chat.tsx:802-815`  — când `remaining <= 0`, cardul afișat este `chat.noMessagesLeft` (stop) +
#                         `chat.premiumOffer` (ofertă) + butonul `chat.choosePremiumButton`.
#                         Cardul de EROARE e a doua ramură a aceluiași `? :`, deci NU se afișează cât timp
#                         cota e epuizată: o eroare afișată în locul ofertei ar fi DEFECT, nu „stare acceptată".
#
# COTA CURATĂ: `clearState: true` pornește ca instalare nouă ⇒ identitate nouă ⇒ 5/5 întrebări.
# Consumul e pe `scope=device` (1 mesaj per instalare), dovedit cu cheia de service. Contorul de pe ecran
# pentru oaspete este `chat.freeLimitLabel` = „{count} din {limit} întrebări gratuite rămase azi".
#
# PESTE ASTA (în afara flow-ului, în harness): plafonul se citește înainte/după din bază
# (`reserve_ai_request` / `ai_client_usage_daily`), ca să se vadă negru pe alb că a 6-a cerere NU a
# crescut consumul. Flow-ul dovedește ecranul; baza o citește instrumentul; raportul le pune împreună.
#
# TEXT FĂRĂ DIACRITICE în `inputText`: pe Android `inputText` trimite textul prin `adb input text`, care
# nu duce diacritice. Aserțiunile (citite din ierarhie) folosesc însă textul EXACT, cu diacritice.
#
# PAUZA DINTRE MESAJE: serverul are `p_cooldown_seconds DEFAULT 5` (migrația
# `20260903000100_harden_ai_usage.sql:9`) — fiecare ciclu așteaptă răspunsul complet (zeci de secunde),
# deci cooldown-ul nu poate fi confundat cu plafonul zilnic.
#
# REPARAT 14.10.2026 — ascunderea tastaturii se face DOAR pe Android (măsurat, nu presupus):
#   • iOS, rularea completă din Codemagic (build 6acf15c8c26598b8d0c4a02e, commit e988b3a, 13 flow-uri x 3
#     treceri): singurul flow PICAT din 39 de celule a fost ACESTA, în TOATE cele 3 treceri, exact la pasul
#     `hideKeyboard`: „Couldn't hide the keyboard. This can happen if the app uses a custom input or doesn't
#     expose a standard dismiss action.". Același pas TRECE pe iOS în account/auth/bible/prayers ⇒ nu pasul
#     e defect, ci contextul de aici (compozitor ascuns după cardul de cotă epuizată).
#   • Android: pasul e OBLIGATORIU — fără el flow-ul PICĂ („Element not found: .*Trimite.*", măsurat
#     14.10.2026 pe emulator, APK vc8), fiindcă `KeyboardAvoidingView` are `behavior` DOAR pe iOS
#     (`src/app/(tabs)/chat.tsx:767`: `behavior={Platform.OS === 'ios' ? 'padding' : undefined}`), deci
#     compozitorul stă sub tastatură.
#   Constructul de mai jos (`runFlow` cu `when.platform`) este deja dovedit VERDE pe AMBELE platforme în
#   `maestro/chat.yaml`. Nu se slăbește NICIO aserțiune: „Trimite" rămâne cerut explicit la fiecare pas.
appId: ro.ortodoxia.app
---
# clearKeychain (adăugat 14.10.2026): pe iOS identitatea de dispozitiv trimisă ca `x-device-id`
# (`src/lib/ai-limit-device.ts:24`) e ținută în Keychain, iar Keychain-ul SUPRAVIEȚUIEȘTE `clearState`.
# Măsurat pe 14.10.2026: reluarea sondei a pornit cu cota deja consumată (contor „0 din 5"), deci
# scara celor 5 întrebări nu mai putea rula — poarta „5 din 5" de mai jos trecea doar pentru că
# aplicația își afișa valoarea implicită până la răspunsul serverului. Pe Android comanda nu are efect.
- launchApp:
    clearState: true
    clearKeychain: true
# Prolog comun: așază aplicația pe limba ROMÂNĂ (emulatorul/simulatorul e implicit pe engleză, iar
# aplicația urmează limba dispozitivului la prima pornire — altfel aserțiunile de mai jos pică).
- runFlow: set-language-ro.yaml
- extendedWaitUntil:
    visible: ".*(Acasă|Home).*"
    timeout: 90000
    label: "PORȚI: aplicația a pornit"
# Tabul de chat se cere EXACT (nu prin centrul ecranului și nu prin „Întreabă ghidul AI" de pe Acasă):
# în rularea Codemagic 6acd43eb selectorul larg apăsa butonul de pe Acasă, iar ierarhia de la picare
# arăta „Biblia, tab ... selected=true". Același motiv ca în chat.yaml/calendar.yaml.
- tapOn:
    text: "^Întreabă(, tab.*)?$"
    label: "PORȚI: intru in chat prin tabul de chat (nu prin butonul de pe Acasă)"
- extendedWaitUntil:
    visible: ".*Scrie întrebarea ta.*"
    timeout: 30000
    label: "PORȚI: ecranul de chat s-a deschis (câmpul de scriere e vizibil)"
# ── PORȚI: cotă curată. Dacă identitatea nu e nouă, contorul nu poate arăta 5/5 și flow-ul se oprește
#    AICI, cu motivul scris: „cotă", nu „defect".
- assertVisible:
    text: "^5 din 5 întrebări gratuite rămase azi$"
    label: "PORȚI: contorul arată cotă CURATĂ, 5/5, înainte de prima întrebare (identitate nouă prin clearState)"
# ── 1/5. Fiecare ciclu: scriu întrebarea, ascund tastatura (altfel acoperă butonul „Trimite"), trimit,
#    și aștept butonul „Raportează" = răspuns COMPLET primit.
- scrollUntilVisible:
    element:
      text: ".*Scrie întrebarea ta.*"
    direction: DOWN
    timeout: 30000
    label: "CICLUL 1/6: derulăm până la compozitor — răspunsul lung îl împinge sub zona vizibilă (rețetă dovedită în chat.yaml:132-137)"
- tapOn: ".*Scrie întrebarea ta.*"
- inputText: "Ce este rugaciunea?"
# Ascunderea tastaturii DOAR pe Android (măsurat 14.10.2026; motivul întreg e în antet):
# pe Android e obligatorie, pe iOS același pas face flow-ul să pice („Couldn't hide the keyboard").
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      text: ".*Trimite.*"
    direction: DOWN
    timeout: 30000
    label: "CICLUL 1/6: derulăm până la butonul de trimitere — același motiv ca la compozitor"
# `enabled: true` = tap-ul se face doar când butonul e APĂSABIL. În cod e `disabled={isSending || isLoading}`
# (`src/app/(tabs)/chat.tsx:809`), deci cât timp răspunsul precedent curge un tap ar fi înghițit tăcut
# — exact cauza măsurată pe 14.10.2026 (5 tap-uri, 3 mesaje numărate, contorul s-a oprit la „2 din 5").
- tapOn:
    text: ".*Trimite.*"
    enabled: true
# DOVADA CĂ CEREREA A PLECAT: butonul de trimitere se blochează imediat ce cererea pleacă
# (`chat.tsx:809`). Dacă tap-ul de mai sus a fost înghițit, butonul nu se blochează și pasul
# acesta spune exact asta, în loc să lase flow-ul să se desincronizeze tăcut.
- extendedWaitUntil:
    visible:
      text: ".*Trimite.*"
      enabled: false
    timeout: 20000
    label: "CICLUL 1/6: cererea a plecat — butonul de trimitere s-a BLOCAT (chat.tsx:809)"
- extendedWaitUntil:
    visible: ".*Raportează.*"
    timeout: 120000
    label: "TREAPTA 1/5: asistentul a terminat un răspuns complet (butonul de raportare există doar sub un răspuns complet)"
# TREAPTA 1/5, dovada ADEVĂRATĂ (adăugat 14.10.2026): pasul „Raportează" de mai sus NU dovedea
# terminarea răspunsului — cardul de bun venit are propriul buton „Raportează" și rămâne pe ecran
# toată conversația (măsurat: ierarhia de la picare arată cardul de bun venit, conversația și cardul
# de stop SIMULTAN; „TREAPTA 1/5" s-a încheiat la 1,7 s după tap, imposibil pentru un răspuns real).
# Butonul de trimitere se deblochează abia când `isSending` devine false = răspunsul s-a terminat.
- extendedWaitUntil:
    visible:
      text: ".*Trimite.*"
      enabled: true
    timeout: 120000
    label: "TREAPTA 1/5: răspunsul s-a TERMINAT — butonul de trimitere s-a deblocat (aplicația e liberă pentru întrebarea următoare)"
# Și contorul serverului, care scade EXACT cu 1 pe fiecare mesaj numărat (cadrul „meta" pleacă
# ÎNAINTE de text: `supabase/functions/orthodox-chat/index.ts:687-696`).
