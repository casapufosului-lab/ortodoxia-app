# PROLOG comun — așază aplicația pe limba ROMÂNĂ înaintea fiecărui flow.
#
# DE CE: aplicația urmează limba dispozitivului la prima pornire
# (src/providers/localization-provider.tsx: `detectDeviceLanguage() ?? 'ro'`), iar emulatorul
# Android și simulatorul iOS din CI sunt implicit pe engleză. Fără acest prolog, aserțiunile
# românești din flow-uri pică pe un ecran corect (aplicația merge, doar vorbește engleză).
#
# CUM: intrăm în Cont și apăsăm opțiunea de limbă „Română" — numele nativ al limbii e același
# în orice limbă (src/app/(tabs)/account.tsx: LANGUAGE_LABELS), deci e un selector sigur.
# Alegerea se salvează în AsyncStorage (`ortodoxia.language`), deci e idempotentă: la a doua
# rulare limba e deja română și prologul doar confirmă.
appId: ro.ortodoxia.app
---
# Pe iOS eticheta unui tab e UN SINGUR nod accesibil, care poarta si iconita si sufixul de
# iconita, nici daca bara intreaga e un singur nod); pe Android textul e un nod propriu,
# selectoarele de tab cer doar ca textul sa CONTINĂ eticheta (nu conteaza ordinea fata de
# "Cont".
# REPARAT 13.10.2026 (dovada: rularea locala Android pe APK vc8, maestro-out/android-chatlocal):
# poarta de pornire avea 45 s, dar pe acest emulator lansarea la rece a build-ului de RELEASE trece
# de 45 s: procesul a pornit 13:03:58, iar `ReactNativeJS: Running "main"` a aparut la 13:04:46
# (logcat), cu 2 secunde dupa expirarea portii (13:04:44). La picare ecranul avea zero noduri de text
# - doar systemui si action_bar_root (aplicatia inca nu randase). Bugetul devine 90 s; nu se scoate
# nicio aserciune, nu se pune `optional: true`, textul cerut ramane acelasi.
- extendedWaitUntil:
    visible: ".*(Cont|Account).*"
    timeout: 90000
    label: "PROLOG: bara de tab-uri s-a desenat (aplicatia a pornit)"
- tapOn:
    text: ".*(Cont|Account).*"
    label: "PROLOG: tab-ul de cont (eticheta depinde de limba curenta si, pe iOS, de iconita)"
# Pe INSTALARE NOUA (chat.yaml foloseste `clearState: true`) prima apasare pe tab poate cadea cat timp
# aplicatia isi termina initializarea (dovada 2026-10-12, rularea p1-chat: apasare la 11:57:17, la 13 s
# dupa pornirea JS, iar ecranul a ramas Acasa).
#
# REPARAT 13.10.2026. Dovada: rularea locala Android tag=chatlocal2, JUnit
# `maestro-out/android-chatlocal2/chatlocal2-chat-reluare1.xml` — „No visible element found: Română".
# Ce s-a intamplat: poarta de mai sus se satisface pe ECRANUL ACASA (tab-ul „Account" e chiar pe Acasa),
# deci trece inainte ca aplicatia sa fie interactiva; apasarea pe tab se pierde, ecranul ramane Acasa in
# engleza, iar `scrollUntilVisible Română` deruleaza ~10 minute pe ecranul greșit si pica.
# Mecanismul de mai jos NU slăbește nicio aserțiune: cere explicit ca ecranul Cont SA SE DESCHIDA si reia
# (apasare + așteptare) pana reușește, cu un numar mărginit de încercări. Așteptarea nu mai e
# `optional: true` — daca ecranul Cont nu se deschide in 4 încercări, prologul cade (corect: fara el
# aserțiunile românești nu au obiect), iar mesajul de eroare arata exact pasul care a picat.
- retry:
    maxRetries: 4
    commands:
      - tapOn:
          text: ".*(Cont|Account).*"
          label: "PROLOG: tab-ul de cont (prima apăsare se poate pierde la inițializare)"
      - extendedWaitUntil:
          visible: ".*(Contul meu|My account|Țară și limbă|Country and language|PROFIL|PROFILE).*"
          timeout: 25000
          label: "PROLOG: ecranul Cont s-a deschis"
- scrollUntilVisible:
    element:
      text: "Română"
    direction: DOWN
    timeout: 30000
    label: "PROLOG: secțiunea de limbă din Cont (opțiunea nativă Română)"
- tapOn: "Română"
- tapOn:
    text: ".*(Acasă|Home).*"
    label: "PROLOG: ne întoarcem pe Acasă (eticheta e acum românească)"
# POARTA este deliberat STRICTA pe limba romana: dupa tap-ul pe "Română" aplicatia trebuie sa vorbeasca
# româneste. Daca aici pica, este un defect REAL de limba (nu se slãbeste poarta la loc, se raporteaza).
- extendedWaitUntil:
    visible: ".*Acasă.*"
    timeout: 20000
    label: "PORȚI: prologul a reușit — aplicația vorbește românește"
