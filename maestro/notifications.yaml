# T1 — Notificări: butonul chiar schimbă starea (nu doar apasă în gol).
#
# LIMITĂ (spusă și în raport): pe simulator NU se pot verifica notificările push reale (APNs/FCM).
# Ce se verifică aici este tot ce ține de aplicație: cardul „Notificări zilnice", starea afișată,
# butonul care o schimbă și ecranul pe care ajunge un vizitator neautentificat.
#
# Două ramuri REALE, ambele posibile pe un dispozitiv nou:
#   A. există un cont autentificat -> butonul „Activează notificările" schimbă starea în „Notificările sunt active.";
#   B. vizitator neautentificat    -> cardul arată „Conectează-te pentru notificări" (account.tsx:526),
#      iar apăsarea duce pe ecranul de autentificare. Aceasta e schimbarea de stare verificabilă fără cont.
# Ramura care nu se aplică este sărită; dacă niciuna nu se aplică, flow-ul pică la aserțiunea de stare.
# EXTINS 12.10.2026 (nimic nu s-a slăbit): în ramura A s-a adăugat mesajul de confirmare cu ora, iar
# la final a apărut ramura A2 — OPRIREA notificărilor. Vezi notele de lîngă fiecare.
appId: ro.ortodoxia.app
---
- launchApp:
    stopApp: true
# Prolog comun: așază aplicația pe limba ROMÂNĂ (emulatorul/simulatorul e implicit pe engleză,
# iar aplicația urmează limba dispozitivului la prima pornire — altfel aserțiunile de mai jos pică).
- runFlow: set-language-ro.yaml
- extendedWaitUntil:
    visible: ".*(Acasă|Home).*"
    timeout: 45000
    label: "PORȚI: aplicația a pornit"
- tapOn: ".*(Cont|Account).*"
# Prologul lasă ecranul Cont derulat la secțiunea de limbă (acolo schimbă limba), iar poziția de
# derulare se păstrează când revii pe tab — deci titlul se caută derulând în SUS, nu se așteaptă.
- scrollUntilVisible:
    element:
      text: "Contul meu"
    direction: UP
    timeout: 30000
    label: "POARTĂ: ecranul Cont s-a deschis (titlul există, chiar dacă ecranul era derulat)"
- scrollUntilVisible:
    element:
      text: "Notificări zilnice"
    direction: DOWN
    timeout: 30000
    label: "secțiunea de notificări"
# Descrierea stă imediat sub titlul secțiunii, dar scroll-ul de mai sus se oprește când TITLUL intră pe
# ecran: dacă se oprește chiar la marginea de jos, descrierea rămâne sub pliu și aserțiunea de mai jos pică
# (dovadă: rularea p3-notifications din 12.10.2026 — pe ecran era „Notificări zilnice", fără card).
# De aceea derulăm până la descriere, o centrăm, și abia apoi o aserționăm. Nu se slăbește nimic.
- scrollUntilVisible:
    element:
      text: "Primești la ora 10:00 versetul, mesajul zilei și sărbătoarea din calendarul ales."
    direction: DOWN
    timeout: 30000
    centerElement: true
    label: "PORȚI: descrierea cardului de notificări e în ecran"
- assertVisible: "Primești la ora 10:00 versetul, mesajul zilei și sărbătoarea din calendarul ales."
- assertVisible:
    text: "Notificările sunt oprite.|Notificările sunt active."
    label: "PORȚI: cardul afișează o stare explicită (nu e ecran gol)"

# ── Ramura A: cont autentificat — butonul schimbă starea ──────────────────────────────────────────
- runFlow:
    when:
      visible: "Activează notificările"
    commands:
      - tapOn: "Activează notificările"
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                text: "Permite|Allow"
                optional: true
                label: "dialogul de permisiune Android 13+ (POST_NOTIFICATIONS)"
      - extendedWaitUntil:
          visible: "Notificările sunt active."
          timeout: 30000
          label: "PORȚI: starea s-a schimbat în active după apăsare"
      - assertVisible: "Oprește notificările zilnice"
      # Extindere 12.10.2026: mesajul de confirmare (singurul loc unde se vede ORA, „ora 10:00”) stă
      # SUB buton, deci se derulează pînă la el — altfel aserțiunea ar pica pe un element sub pliu.
      - scrollUntilVisible:
          element:
            text: "Notificările zilnice sunt active pentru ora 10:00."
          direction: DOWN
          timeout: 20000
          centerElement: true
          label: "PORȚI: mesajul de confirmare al activării (account.notificationsActiveMessage)"
      - assertVisible: "Notificările zilnice sunt active pentru ora 10:00."
      - takeScreenshot: notifications-active

# ── Ramura B: vizitator neautentificat — butonul duce pe autentificare ────────────────────────────
- runFlow:
    when:
      visible: "Conectează-te pentru notificări"
    commands:
      - tapOn: "Conectează-te pentru notificări"
      - extendedWaitUntil:
          visible: "Bine ai revenit"
          timeout: 30000
          label: "PORȚI: butonul chiar duce undeva (ecranul de autentificare)"
      - assertVisible: "Autentificare"
      - takeScreenshot: notifications-auth-gate

# ── Ramura A2 (extindere 12.10.2026): OPRIREA notificărilor ─────────────────────────────────────
# Se intră doar dacă butonul de oprire e pe ecran (adică starea e „active” — fie de la ramura A, fie
# de dinainte). De ce contează: account.tsx:354-361 spune negru pe alb că aplicația NU avea niciun
# drum de oprire (singura scriere în `notification_preferences` punea enabled:true), deci un om care
# voia să scape de notificări continua să le primească. Butonul de acum trebuie să scrie enabled:false
# și să dezactiveze rîndurile din `notification_devices`; aici se dovedește că starea AFIȘATĂ se
# schimbă în ambele sensuri, nu doar că butonul se apasă.
- runFlow:
    when:
      visible: "Oprește notificările zilnice"
    commands:
      - tapOn: "Oprește notificările zilnice"
      - extendedWaitUntil:
          visible: "Notificările sunt oprite."
          timeout: 30000
          label: "POARTĂ: starea s-a schimbat în oprite după apăsare"
      - scrollUntilVisible:
          element:
            text: "Notificările zilnice au fost oprite."
          direction: DOWN
          timeout: 20000
          centerElement: true
          label: "PORȚI: mesajul de confirmare al opririi (account.notificationsDisabledMessage)"
      - assertVisible: "Notificările zilnice au fost oprite."
      - assertVisible: "Activează notificările"
      - assertNotVisible: "Notificările sunt active."
      - takeScreenshot: notifications-disabled
# Stare la ieșire: notificările rămîn OPRITE dacă erau pornite (comutatorul a fost dovedit în ambele
# sensuri). La rularea următoare, ramura A le pornește iar — fluxul e repetabil.
# NU se aserționează „Notificări indisponibile” ca titlu de card: în cod (account.tsx:509) titlul
# secțiunii e mereu „Notificări zilnice”, iar account.notificationsUnavailableTitle (linia 149) apare
# doar ca ALERTĂ cînd preferința nu poate fi citită din bază. Rămîne spusă limita: pe simulator nu se
# pot verifica notificările push reale (APNs/FCM).
