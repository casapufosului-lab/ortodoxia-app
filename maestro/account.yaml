# T2 — Cont (07): profil, țară și limbă, calendar, notificări on/off, plan, despre, zona periculoasă.
#
# DE CE ARATĂ AȘA:
#  - Ecranul se verifică în starea în care pornește Maestro: OASPETE (`clearState: true` → nicio sesiune
#    salvată). De aceea cardul de profil e cel de oaspete, iar butoanele care schimbă date reale în cont
#    („Șterge contul") NU se apasă nicăieri în acest flow — se asertează că NU există pentru un oaspete.
#  - Toate textele asertate sunt chei i18n reale (română) din src/i18n/config.ts, extrase cu scriptul
#    extract-i18n.mjs (PowerShell distorsionează diacriticele), plus două șiruri care NU vin din i18n, ci
#    din cod: numele limbilor (LANGUAGE_LABELS, src/app/(tabs)/account.tsx:45-61) și codul de regiune
#    afișat sub țară (`option.locale`, src/i18n/config.ts:80 → `ro-RO`).
#  - FUS ORAR: aplicația NU are selector de fus orar și nu afișează niciun fus orar pe ecran.
#    `timeZone` există doar în tipul de configurare al regiunii (src/i18n/config.ts:81,
#    `timeZone: 'Europe/Bucharest'`) și e folosit la construirea configurației
#    (src/app/(tabs)/account.tsx:312) — se derivă din țară, nu se alege. Nu se inventează un pas pentru
#    el: ce se poate aserta real este regiunea și codul ei de localizare (`ro-RO`), care sunt exact
#    sursa fusului orar. (Aceeași limitare este raportată și în raportul taskului.)
#  - Planul de abonament: cardul are DOAR valorile pe care le poate lua `planLabelText`/`planBodyText`
#    (src/app/(tabs)/account.tsx:398-402, chei din src/lib/subscription.ts:228-274). Nu se asertează
#    niciun text care depinde de magazin (preț, „cumpără"), pentru că pe simulator magazinul poate lipsi.
appId: ro.ortodoxia.app
---
- launchApp:
    clearState: true
# Prolog comun: așază aplicația pe limba ROMÂNĂ (ecranul Cont e chiar unealta lui: opțiunea „Română").
- runFlow: set-language-ro.yaml
- extendedWaitUntil:
    visible: ".*(Acasă|Home).*"
    timeout: 45000
    label: "PORȚI: aplicația a pornit"
- tapOn:
    text: ".*(Cont|Account).*"
    label: "deschidem ecranul 07 din bara de tab-uri"
- scrollUntilVisible:
    element:
      text: "Contul meu"
    direction: UP
    timeout: 20000
    label: "PORȚI: derulăm în sus până la titlul ecranului Cont (prologul lasă ecranul la secțiunea de limbă)"
- extendedWaitUntil:
    visible: "Contul meu"
    timeout: 20000
    label: "PORȚI: ecranul Cont s-a deschis (titlul e cel din i18n, account.pageTitle)"
- assertVisible: "Salvează favoritele, conversațiile și accesul Premium."
# ── 1. PROFIL (starea de oaspete: exact ce vede un om care nu s-a autentificat)
- assertVisible: "Folosești aplicația fără cont"
- assertVisible:
    text: "Creează un cont pentru a sincroniza conținutul pe dispozitivele tale."
    label: "PORȚI: profilul de oaspete își explică rostul (account.guestBody)"
- assertVisible:
    text: "Autentificare sau cont nou"
    label: "PORȚI: din Cont se poate ajunge la autentificare (account.guestAuthButton)"
- assertNotVisible:
    text: "Cont activ"
    label: "REGRESIA: ecranul nu ne prezintă ca fiind autentificați (account.activeTitle lipsește pentru oaspete)"
- assertNotVisible:
    text: ".*Zona periculoasă.*"
    label: "REGRESIA: un oaspete nu primește secțiunea de ștergere a contului (account.dangerZoneTitle)"
- assertNotVisible:
    text: ".*Șterge contul.*"
    label: "REGRESIA: butonul de ștergere a contului nu există fără cont (fără risc de ștergere reală)"
# ── 2. ȚARĂ ȘI LIMBĂ (inclusiv codul de regiune din care se derivă fusul orar)
- scrollUntilVisible:
    element:
      text: "Țară și limbă"
    direction: DOWN
    timeout: 30000
    label: "PORȚI: secțiunea Țară și limbă (account.regionTitle)"
- assertVisible:
    text: "Țara stabilește calendarul, sursele locale și moneda. Limba poate fi schimbată separat când adăugăm traduceri noi."
    label: "PORȚI: ecranul spune ce anume schimbă țara (account.regionDescription)"
- assertVisible: "Țara"
# REPARAȚIE iOS (12.10.2026, rularea Codemagic 6acce139): rândul de țară are DOUĂ <Text>-uri
# (numele + codul de localizare, src/app/(tabs)/account.tsx:456-457), iar iOS le contopește într-o
# singură etichetă de accesibilitate: „România, ro-RO”. De aceea potrivirea exactă „România”
# pica pe iOS deși textul e pe ecran (dovadă: hierarchy-pass1-account.txt). Se tolerează DOAR sufixul
# de localizare al aceleiași etichete — textul cerut rămâne neschimbat, ca pe Android.
- assertVisible:
    text: "^România(, ro-RO)?$"
    label: "PORȚI: țara implicită e o regiune reală din listă (DEFAULT_COUNTRY = 'RO')"
- assertVisible:
    text: "^.*ro-RO$"
    label: "PORȚI: sub țară e codul de localizare al regiunii (sursa fusului orar: Europe/Bucharest; pe iOS e lipit de numele țării)"
- scrollUntilVisible:
    element:
      text: "English"
    direction: DOWN
    timeout: 20000
    label: "PORȚI: lista de limbi complete e pe ecran (numele native, nu traduceri)"
- assertVisible:
    text: "Română"
    label: "PORȚI: limba curentă e chiar cea pe care a fixat-o prologul"
# ── 3. CALENDAR BISERICESC (descrierea de calendar e dinamică pentru RO, deci nu se asertează textul ei)
#     REPARAȚIE RUNDA 2 (12.10.2026): secțiunea stă SUB listele din „Țară și limbă", deci elementul era în
#     afara ecranului. Dovada: JUnit runda1fix-account — „Assertion is false: \"Calendar bisericesc\" is
#     visible", comanda #31, ierarhia pas-032 arăta doar secțiunea Țară și limbă + bara de tab-uri.
#     Se derulează LA element, iar aserțiunea rămâne EXACT aceeași (nu se slăbește nimic).
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            text: "Calendar bisericesc"
          direction: DOWN
          timeout: 20000
          label: "POARTĂ: secțiunea de calendar bisericesc e adusă pe ecran (elementul stătea sub listele de limbi)"
# REPARAȚIE (14.10.2026) — derularea pe iOS, în pași MICI, oprită de apariția elementului.
# Dovada că `scrollUntilVisible` NU e de încredere pe iOS 26.2 (rularea 38550077104, pass1 account):
# JUnit a scris „No visible element found: \"Calendar bisericesc\"", iar ierarhia salvată în același
# moment arăta elementul PE ECRAN — accessibilityText=Calendar bisericesc; bounds=[39,397][363,413] —
# cu bara de derulare la „4 pages; value=64%". E aceeași clasă de defect ca la `legal.yaml` (03d53dc),
# unde gesturile fixe au rezolvat. Diferența față de `legal`: acolo ținta era ULTIMUL element al
# documentului, deci un număr fix de gesturi mari nu putea derula peste ea; aici ținta stă la mijlocul
# paginii, iar gesturile mari ar putea-o scoate pe sus din ecran. De aceea: pași de 40% din înălțime
# (sub înălțimea ecranului, deci nu pot sări peste element), cel mult 12, iar bucla se oprește de
# îndată ce elementul apare. Aserțiunea de după rămâne EXACT aceeași; traseul Android rămâne neatins.
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 12
          while:
            notVisible: "Calendar bisericesc"
          commands:
            - swipe:
                start: "50%, 70%"
                end: "50%, 30%"
                duration: 400
      # Rețeta dovedită în depozit (legal.yaml:131-134): după ultimul gest, aștept AȘEZAREA derulării
      # înainte de poarta strictă. `scrollUntilVisible` își face controlul imediat după gest, cu ecranul
      # încă în inerție — de aceea raporta „nu e vizibil" pe un element aflat pe ecran. Aici controlul
      # se face după animație; aserțiunea de mai jos rămâne EXACT aceeași.
      - extendedWaitUntil:
          visible: "Calendar bisericesc"
          timeout: 15000
          label: "toleranță pe iOS: aștept așezarea derulării înainte de poartă (controlul se face după animație)"
- assertVisible: "Calendar bisericesc"
# ── 4. NOTIFICĂRI (starea reală la prima pornire: oprite) și limita onestă a simulatoarelor:
#     un push real (APNs/FCM) NU poate fi dovedit aici; se asertează starea și butoanele, nu livrarea.
#     REPARAȚIE RUNDA 3 (12.10.2026): derularea se oprea la TITLUL secțiunii, care ajungea pe muchia de
#     jos a ecranului, iar rândurile de sub el (starea + îndemnul) rămâneau decupate — deci lipseau din
#     ierarhie, nu din aplicație. Dovada: JUnit runda2fix-account — „Assertion is false: \"Notificările sunt
#     oprite.\" is visible", comanda #35, ierarhia pas-036 avea „Notificări zilnice" + descrierea, dar NU
#     starea (și nici „Conectează-te pentru notificări"); în același build, pe ecranul derulat mai jos
#     (flow-ul legal, 15:16) ambele rânduri APĂREAU. Centrăm titlul, ca tot cardul să fie pe ecran;
#     aserțiunile rămân EXACT aceleași.
- scrollUntilVisible:
    element:
      text: "Notificări zilnice"
    direction: DOWN
    timeout: 20000
    centerElement: true
    label: "PORȚI: secțiunea de notificări, cu tot cardul pe ecran (account.notificationsSectionTitle)"
- assertVisible:
    text: "Primești la ora 10:00 versetul, mesajul zilei și sărbătoarea din calendarul ales."
    label: "PORȚI: ecranul promite exact ora la care trimite (account.notificationsDescription)"
- assertVisible:
    text: "Notificările sunt oprite."
    label: "PORȚI: starea de pornire e cea corectă — OPRITE, fără nicio urmă de activare nesolicitată"
- assertVisible:
    text: "Conectează-te pentru notificări"
    label: "PORȚI: un oaspete e îndrumat să se conecteze, nu i se promite un push imposibil"
- assertNotVisible:
    text: "Notificările sunt active."
    label: "REGRESIA: aplicația nu se laudă cu notificări active fără cont și fără acord"
- assertNotVisible:
    text: "Activează notificările"
    label: "REGRESIA: butonul de activare nu se oferă unui oaspete (ar cere cont, ar promite în gol)"
# ── 5. ABONAMENT (planul afișat iese din planSummary; se acoperă TOATE valorile pe care le poate lua)
# REPARAȚIE RUNDA 4: derularea se oprea când titlul „Abonament" devenea vizibil, iar acesta se oprește
# la marginea de jos a ecranului ⇒ eticheta planului, care stă chiar sub titlu, rămânea în afara
# ecranului și #40 pica în JUnit: `Assertion is false: "Se verifică planul…|Plan Gratuit|Premium.*" is
# visible`, cu ierarhia care conținea „Abonament" dar NU eticheta planului. Acum se derulează până când
# ETICHETA planului e pe ecran, centrată; aserțiunea de mai jos rămâne neschimbată, literă cu literă.
- scrollUntilVisible:
    element:
      text: "Se verifică planul…|Plan Gratuit|Premium.*"
    direction: DOWN
    timeout: 20000
    centerElement: true
    label: "PORȚI: eticheta planului e adusă pe ecran (nu doar titlul secțiunii)"
- assertVisible:
    text: "Se verifică planul…|Plan Gratuit|Premium.*"
    label: "PORȚI: planul afișat e unul real (account.planChecking sau o etichetă de abonament din planSummary)"
- assertVisible:
    text: "Ai 5 mesaje AI pe zi\\. Conținutul de bază rămâne gratuit\\.|Ai [0-9]+ de mesaje AI pe zi\\."
    label: "PORȚI: se spune câte mesaje AI are omul (plan gratuit = 5/zi, abonat = câte are)"
- assertVisible:
    text: "Vezi Premium|Vezi abonamentul"
    label: "PORȚI: cardul de abonament duce într-un loc real, potrivit stării planului"
# REPARAȚIE RUNDA 3: butonul „Deschide Chatul AI" stă sub cardul de abonament (care e înalt), deci se
# aduce pe ecran înainte de aserțiune; verificarea rămâne aceeași.
- scrollUntilVisible:
    element:
      text: "Deschide Chatul AI"
    direction: DOWN
    timeout: 20000
    label: "PORȚI: butonul spre conversația AI e adus pe ecran (stă sub cardul de abonament)"
- assertVisible:
    text: "Deschide Chatul AI"
    label: "PORȚI: din Cont se poate ajunge direct în conversația AI"
# ── 6. DESPRE APLICAȚIE (documentele legale sunt reale, nu rânduri moarte)
- scrollUntilVisible:
    element:
      text: "Despre aplicație"
    direction: DOWN
    timeout: 20000
    centerElement: true
    label: "PORȚI: secțiunea Despre aplicație (account.aboutSectionTitle)"
- assertVisible: "Politica de confidențialitate"
- assertVisible: "Termeni și condiții"
- assertVisible:
    text: "Surse și responsabilitate editorială"
    label: "PORȚI: aplicația declară pe ecran cine răspunde de conținut"
- takeScreenshot: cont-07
