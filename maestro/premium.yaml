# T1 — Premium: eticheta planului și butoanele sunt acolo, cu textul lor real.
#
# Calea din interfață (fără deep link): Cont -> cardul „Abonament" -> butonul spre /premium.
# Butonul cardului depinde de planul citit din `subscriptions` (src/lib/subscription.ts):
#   plan gratuit -> „Vezi Premium"; abonament activ -> „Vezi abonamentul".
#
# Vizitator neautentificat = starea de pe un dispozitiv nou: butoanele de cumpărare se numesc
# „Autentifică-te pentru Premium" (premium.loginToSubscribe), iar dacă magazinul nu e disponibil
# ele nu se randează deloc (planAction 'pending'). De aceea aserțiunea pe butoane acceptă toate
# formele reale, dar CERE una dintre ele — un ecran gol pica.
appId: ro.ortodoxia.app
---
- launchApp:
    stopApp: true
# Prolog comun: așază aplicația pe limba ROMÂNĂ (emulatorul/simulatorul e implicit pe engleză,
# iar aplicația urmează limba dispozitivului la prima pornire — altfel aserțiunile de mai jos pică).
- runFlow: set-language-ro.yaml
- extendedWaitUntil:
    visible: ".*(Acasă|Home).*"
    timeout: 45000
    label: "PORȚI: aplicația a pornit"
- tapOn: ".*(Cont|Account).*"
# Prologul lasă ecranul Cont derulat la secțiunea de limbă (acolo schimbă limba), iar poziția de
# derulare se păstrează când revii pe tab — deci titlul se caută derulând în SUS, nu se așteaptă.
- scrollUntilVisible:
    element:
      text: "Contul meu"
    direction: UP
    timeout: 30000
    label: "POARTĂ: ecranul Cont s-a deschis (titlul există, chiar dacă ecranul era derulat)"
- scrollUntilVisible:
    element:
      text: "Abonament"
    direction: DOWN
    timeout: 20000
    label: "cardul Abonament"
- tapOn:
    text: "Vezi Premium|Vezi abonamentul"
    label: "butonul cardului de abonament duce la /premium"
- extendedWaitUntil:
    visible: "Ortodoxia Premium"
    timeout: 30000
    label: "PORȚI: ecranul Premium s-a deschis"
# Eticheta planului: „Planul tău" + valoarea ei (gratuit sau Premium, după ce spune magazinul).
- assertVisible: "Planul tău"
- assertVisible:
    text: "Plan Gratuit|Premium activ — abonamentul este confirmat de magazin.|Premium Lunar|Premium Anual"
    label: "PORȚI: eticheta planului are una dintre valorile reale (nu e ecran gol)"
- assertVisible: "5 mesaje AI pe zi. Rugăciunile, calendarul și conținutul zilnic rămân gratuite."
# Cele două planuri, cu prețul lor (din magazin; „Preț în magazin" până vine răspunsul).
- scrollUntilVisible:
    element:
      text: "Lunar"
    direction: DOWN
    timeout: 20000
    label: "primul plan (lunar)"
# Cardurile de plan sunt unul SUB altul, iar derularea se oprește de îndată ce ținta devine vizibilă
# (poate rămâne chiar la marginea de jos). De aceea fiecare țintă are propriul pas de derulare.
- scrollUntilVisible:
    element:
      text: 'Autentifică-te pentru Premium|Activează planul lunar|Treci la lunar|Planul tău actual|Se procesează…|Acest dispozitiv nu poate face cumpărături în magazin\. Instalează aplicația din Google Play sau App Store și încearcă din nou acolo — nu este o defecțiune a aplicației\.|Magazinul nu este disponibil momentan\.|Planul ales nu este disponibil în magazin\.|Magazinul nu are deocamdată niciun abonament disponibil pentru acest cont\. Reîncearcă mai târziu\.|Magazinul nu a trimis prețul acestui plan, așa că nu îl putem afișa\. Reîncearcă mai târziu\.|Se deschide magazinul\. Schimbarea de plan se face prin App Store; data de la care se aplică și suma apar în fereastra magazinului\.'
    direction: DOWN
    timeout: 20000
    label: "POARTĂ: cardul lunar are un corp explicit — buton de activare/schimbare SAU textul care spune de ce nu există (magazin indisponibil / dispozitiv care nu poate cumpăra / vizitator)"
- scrollUntilVisible:
    element:
      text: "Anual"
    direction: DOWN
    timeout: 20000
    label: "al doilea plan (anual) — se derulează mai jos decât primul"
- assertVisible: "Anual"
- assertVisible: "Abonamentul se reînnoiește automat până îl oprești din magazin."
- scrollUntilVisible:
    element:
      text: "Restaurează cumpărăturile"
    direction: DOWN
    timeout: 20000
    label: "butonul de restaurare a cumpărăturilor"
- assertVisible: "Plățile se procesează securizat prin App Store sau Google Play."
- takeScreenshot: premium
